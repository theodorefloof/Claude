<title>Sway Barcelona Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f7f6f2;
  --surface:#ffffff;
  --surface-2:#f1efe9;
  --ink:#15171c;
  --ink-2:#3c424b;
  --muted:#71767f;
  --line:#e0ded5;
  --line-2:#c8c5b9;
  --go:#1c5c4c;
  --go-soft:#e2eee9;
  --stop:#a8431d;
  --stop-soft:#f8e9e1;
  --build:#33507a;
  --build-soft:#e5ebf4;
  --focus:#1c5c4c;
  --shadow-1:0 1px 2px rgba(21,23,28,.05);
  --shadow-2:0 2px 4px rgba(21,23,28,.05),0 12px 28px -18px rgba(21,23,28,.45);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1115;--surface:#171a20;--surface-2:#1f232b;--ink:#eceae4;--ink-2:#c5c8c4;--muted:#8d939c;
    --line:#282d36;--line-2:#3b424e;--go:#5fbfa2;--go-soft:#15302a;--stop:#e08350;--stop-soft:#33211a;
    --build:#7fa5dd;--build-soft:#1a2436;--focus:#5fbfa2;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 2px 6px rgba(0,0,0,.4),0 14px 30px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1115;--surface:#171a20;--surface-2:#1f232b;--ink:#eceae4;--ink-2:#c5c8c4;--muted:#8d939c;
  --line:#282d36;--line-2:#3b424e;--go:#5fbfa2;--go-soft:#15302a;--stop:#e08350;--stop-soft:#33211a;
  --build:#7fa5dd;--build-soft:#1a2436;--focus:#5fbfa2;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 2px 6px rgba(0,0,0,.4),0 14px 30px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--go)}
button{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--sans);text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;word-break:break-word}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
.mark{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.mark h1{font-size:16px;font-weight:700;letter-spacing:-.01em}
.mark p{margin:3px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.railnav{padding:12px 10px;flex:1;overflow-y:auto}
.railnav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;text-decoration:none;
  font-family:var(--sans);font-size:14px;color:var(--ink-2);font-weight:500}
.railnav a:hover{background:var(--surface-2);color:var(--ink)}
.railnav a.on{background:var(--go-soft);color:var(--go);font-weight:600}
.railnav .gl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:16px 11px 5px}
.railnav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.railnav a.on .badge{color:var(--go)}
.railfoot{border-top:1px solid var(--line);padding:11px 14px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--go)}
.dot.local{background:var(--stop)}
.tbtn{margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--muted);border-radius:6px;
  padding:3px 8px;font-family:var(--sans);font-size:11px;cursor:pointer}
.tbtn:hover{color:var(--ink);background:var(--surface-2)}

.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;
  padding:11px 26px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:blur(10px)}
.bar .crumb{font-family:var(--mono);font-size:11px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.burger{display:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:7px;
  padding:6px 10px;font-size:12px;cursor:pointer}
.page{padding:32px 26px 110px;width:100%;max-width:1160px;margin:0 auto}
.narrow{max-width:760px}

/* type */
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h-xl{font-size:clamp(28px,4vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.02em}
.h-l{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.h-m{font-size:17px;font-weight:600}
.h-s{font-size:14px;font-weight:600;font-family:var(--sans)}
.lede{font-size:18px;line-height:1.5;color:var(--ink-2);max-width:62ch}
.sub{font-family:var(--sans);font-size:13px;color:var(--muted)}
.sec{margin-top:44px}
.sec > .kicker{margin-bottom:10px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.pad{padding:20px 22px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stat{padding:15px 17px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat dd{margin:6px 0 0;font-family:var(--sans);font-size:19px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.stat dd small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
  padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.go{background:var(--go-soft);color:var(--go);border-color:transparent}
.chip.stop{background:var(--stop-soft);color:var(--stop);border-color:transparent}
.chip.build{background:var(--build-soft);color:var(--build);border-color:transparent}

/* timeline */
.day{display:grid;grid-template-columns:330px minmax(0,1fr);gap:26px;align-items:start}
.day > *{min-width:0}
.variants{margin:18px 0 6px;padding:14px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface-2)}
.variants .kicker{margin-bottom:8px}
.vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;margin-top:8px;cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,transform .12s}
.vrow:hover{border-color:var(--line-2);transform:translateX(2px)}
.vrow .t{font-weight:600;font-size:13.5px}
.vrow .w{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.vrow .chip{margin-left:auto;flex:none}
.stops{margin:12px 0 20px;border:1px solid var(--line);border-left:3px solid var(--stop);border-radius:9px;
  background:var(--surface);overflow:hidden}
.stops summary{cursor:pointer;padding:10px 14px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.stops summary::-webkit-details-marker{display:none}
.stops .lab{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--stop)}
.stops .cnt{font-family:var(--mono);font-size:10px;color:var(--muted)}
.stops ul{margin:0;padding:0 16px 13px 32px}
.stops li{font-family:var(--sans);font-size:12px;line-height:1.45;color:var(--ink-2);margin-bottom:5px}
.filehint{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin:-6px 0 12px}
.filehint code{font-size:.92em}
.tl{position:relative;padding-left:2px}
.tl-item{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:stretch;width:100%;text-align:left;
  background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.tl-time{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:13px;text-align:right}
.tl-body{position:relative;padding:11px 12px 11px 20px;border-radius:9px;border:1px solid transparent}
.tl-body::before{content:"";position:absolute;left:7px;top:17px;width:9px;height:9px;border-radius:50%;
  border:2px solid var(--line-2);background:var(--paper)}
.tl-body::after{content:"";position:absolute;left:11px;top:26px;bottom:-9px;width:1px;background:var(--line)}
.tl-item:last-child .tl-body::after{display:none}
.tl-item:hover .tl-body{background:var(--surface-2)}
.tl-item.sel .tl-body{background:var(--surface);border-color:var(--line-2);box-shadow:var(--shadow-1)}
.tl-item.done .tl-body::before{background:var(--line-2);border-color:var(--line-2)}
.tl-item.now .tl-body::before{border-color:var(--go);background:var(--go);box-shadow:0 0 0 4px var(--go-soft)}
.tl-item.k-build .tl-body::before{border-color:var(--build)}
.tl-item.k-review .tl-body::before{border-color:var(--stop)}
.tl-item.k-rest .tl-body::before{border-style:dashed;background:transparent}
.tl-item.pre .tl-body{border:1px dashed var(--line-2);background:var(--surface-2)}
.tl-item.pre .tl-t{font-weight:600;color:var(--ink)}
.tl-item.pre .tl-time{font-size:9.5px}
.tl-t{font-family:var(--sans);font-size:13.5px;font-weight:600;line-height:1.3}
.tl-item.k-rest .tl-t{font-weight:400;color:var(--muted)}
.tl-m{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.tl-flags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.mini{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:4px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.mini.go{background:var(--go-soft);color:var(--go);border-color:transparent}
.mini.build{background:var(--build-soft);color:var(--build);border-color:transparent}
.mini.stop{background:var(--stop-soft);color:var(--stop);border-color:transparent}

/* session detail */
.det{position:sticky;top:78px}
.det-head{padding:22px 24px 18px;border-bottom:1px solid var(--line)}
.det-head .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.det-q{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--ink-2);margin:12px 0 0;max-width:60ch}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

.timer{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);
  background:var(--surface-2)}
.clock{font-family:var(--mono);font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1}
.clock.over{color:var(--stop)}
.tprog{flex:1;min-width:60px}
.tprog .track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.tprog .fill{height:100%;background:var(--go);width:0;transition:width .4s linear}
.tprog .fill.over{background:var(--stop)}
.tprog .lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px}
.btn{border:none;border-radius:8px;padding:9px 16px;font-family:var(--sans);font-size:13px;font-weight:600;
  cursor:pointer;background:var(--go);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}

.blk{padding:20px 24px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:none}
.blk > .kicker{margin-bottom:12px}

.step{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:8px;border:1px solid transparent}
.step:hover{background:var(--surface-2)}
.step.cur{background:var(--go-soft);border-color:color-mix(in srgb,var(--go) 25%,transparent)}
.step input{margin:4px 0 0;width:15px;height:15px;accent-color:var(--go);flex:none}
.step .min{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:34px;padding-top:2px;flex:none}
.step.cur .min{color:var(--go)}
.step .txt{font-family:var(--sans);font-size:13.5px;line-height:1.45;flex:1}
.step.ticked .txt{color:var(--muted);text-decoration:line-through}

.deck{background:var(--surface-2);border-radius:var(--r);padding:20px 22px;min-height:118px;display:flex;
  flex-direction:column;justify-content:center}
.deck .q{font-family:var(--serif);font-size:19px;line-height:1.45;max-width:54ch}
.deckbar{display:flex;align-items:center;gap:10px;margin-top:14px}
.deckbar .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

.field{margin-bottom:16px}
.field label{display:block;font-family:var(--sans);font-size:13px;font-weight:600;margin-bottom:3px}
.field .hint{font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:6px}
textarea,input[type=text]{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);
  color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.55;padding:10px 12px;resize:vertical}
textarea:focus{background:var(--surface)}
.meta{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;display:flex;gap:7px;align-items:center;min-height:13px}
.sd{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.sd.p{background:var(--stop)}
.sd.ok{background:var(--go)}

details.fall{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:0}
details.fall summary{cursor:pointer;padding:11px 14px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--stop)}
details.fall .in{padding:0 14px 14px;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.navpair{display:flex;gap:10px;padding:18px 24px;background:var(--surface-2);border-top:1px solid var(--line)}
.navpair button{flex:1}

/* prep */
.eve{margin-bottom:16px}
.eve-h{display:flex;align-items:baseline;gap:12px;padding:0 2px 10px;flex-wrap:wrap}
.eve-h h3{font-size:16px;font-weight:600}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:7px;
  cursor:pointer;font:inherit;color:inherit}
.task:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.task.done{background:var(--surface-2)}
.task .tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;
  font-size:11px;color:#fff}
.task.done .tick{background:var(--go);border-color:var(--go)}
.task .t{font-family:var(--sans);font-size:13.5px;font-weight:600;line-height:1.35}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .w{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:2px}

/* prep filter and owner accents */
.whofilter{display:flex;align-items:center;gap:8px;margin:24px 0 4px;flex-wrap:wrap}
.wf{background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:5px 13px;
  font-family:var(--sans);font-size:12px;color:var(--ink-2);cursor:pointer}
.wf:hover{background:var(--surface-2)}
.wf.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.task{border-left-width:3px}
.task.w-blake{border-left-color:var(--go)}
.task.w-tori{border-left-color:var(--stop)}
.task.w-both{border-left-color:var(--line-2)}

.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:6px}
.track-col{min-width:0}
.track-h{display:flex;align-items:baseline;gap:8px;padding:0 0 7px;border-bottom:1px solid var(--line);margin-bottom:6px}
.track-h .tmin{font-size:10.5px;color:var(--muted);margin-left:auto}

/* prototype extras */
.blocks{display:grid;gap:8px}
.brow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--build);border-radius:9px;padding:12px 14px;
  cursor:pointer;font:inherit;color:inherit}
.brow:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.brow .t{font-family:var(--sans);font-size:13.5px;font-weight:600}
.brow .w{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.brow .chip{margin-left:auto;flex:none}
.risks{display:grid;gap:6px;margin-top:12px}
details.risk{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
details.risk summary{cursor:pointer;padding:10px 13px;font-family:var(--sans);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
details.risk[open] summary{font-weight:600;color:var(--stop)}
details.risk .in{padding:0 13px 12px;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--ink-2)}

.field.sealed textarea{border-color:var(--stop);background:var(--stop-soft)}
.field .seal{font-family:var(--mono);font-size:10.5px;color:var(--stop);margin-bottom:6px;letter-spacing:.02em;line-height:1.5}
.sealbanner{background:var(--stop-soft);border:1px solid color-mix(in srgb,var(--stop) 30%,transparent);
  border-radius:9px;padding:12px 14px;font-family:var(--sans);font-size:12.5px;line-height:1.5;
  color:var(--stop);margin-bottom:16px}
.task.sealed-task{border-left-color:var(--stop);border-left-width:3px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,17,21,.4);z-index:50;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:60;
  border-left:1px solid var(--line);box-shadow:var(--shadow-2);transform:translateX(100%);transition:transform .22s ease;
  display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-h{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.sheet-b{overflow-y:auto;padding:22px 24px 60px;flex:1}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;margin-left:auto}
.x:hover{color:var(--ink)}

/* lists */
.plain{margin:0;padding-left:20px}
.plain li{margin-bottom:7px;font-family:var(--sans);font-size:13.5px;line-height:1.5}
.ticks{list-style:none;margin:0;padding:0}
.ticks li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:7px}
.ticks li:hover{background:var(--surface-2)}
.ticks input{margin:3px 0 0;width:15px;height:15px;accent-color:var(--go);flex:none}
.ticks .txt{font-family:var(--sans);font-size:13.5px;line-height:1.45}
.ticks li.on .txt{color:var(--muted);text-decoration:line-through}
.qrow{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.qn{font-family:var(--mono);font-size:19px;color:var(--line-2);font-weight:500}
.qt{font-family:var(--sans);font-size:15px;font-weight:600;margin-bottom:3px}
.qd{font-family:var(--sans);font-size:12.5px;color:var(--muted)}

.tens{display:grid;gap:8px;margin-top:14px}
.trow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;
  transition:border-color .12s,background .12s}
.trow:hover:not(:disabled){border-color:var(--line-2);background:var(--surface)}
.trow:disabled{cursor:default;opacity:.85}
.trow .t{font-family:var(--sans);font-size:13.5px;font-weight:600;line-height:1.35}
.trow .i{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.trow .chip{flex:none;margin-top:1px}
.trow .tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);flex:none;display:grid;
  place-items:center;font-size:11px;color:transparent;margin-top:1px}
.trow.done .tick{background:var(--go);border-color:var(--go);color:#fff}
.trow.done .t{color:var(--muted);text-decoration:line-through}
.trow.w-blake{border-left:3px solid var(--go)}
.trow.w-tori{border-left:3px solid var(--stop)}
.trow.w-both{border-left:3px solid var(--line-2)}
.gloss{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;align-items:baseline}
.gloss dt{font-family:var(--mono);font-size:12px;color:var(--go);white-space:nowrap}
.gloss dd{margin:0;font-family:var(--sans);font-size:13px;color:var(--ink-2);line-height:1.45}
@media (max-width:560px){.gloss{grid-template-columns:1fr;gap:2px 0}.gloss dd{margin-bottom:10px}}

details.fold{border-top:1px solid var(--line);margin-top:14px}
details.fold summary{cursor:pointer;padding:11px 0 2px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--go)}
details.fold summary::marker{color:var(--line-2)}
details.fold .in{padding:10px 0 4px}
.labs{display:grid;gap:7px}
.labchip{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:baseline;width:100%;text-align:left;
  background:none;border:none;border-bottom:1px solid var(--line);padding:9px 0;font:inherit;color:inherit;cursor:default}
.labchip:last-of-type{border-bottom:none}
.labchip .n{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--go)}
.labchip .m{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.45}
@media (max-width:560px){.labchip{grid-template-columns:1fr;gap:2px}}
.assume{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--stop);border-radius:8px;
  padding:12px 14px;font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink-2);margin:6px 0 18px}

/* doc reader */
.doc{max-width:74ch;font-size:15.5px}
.doc.wide{max-width:none}
.doc h2{font-size:25px;margin:0 0 8px;letter-spacing:-.01em}
.doc h3{font-size:17px;margin:32px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.doc h4{font-size:14px;margin:20px 0 6px}
.doc p{margin:0 0 13px}
.doc ul,.doc ol{margin:0 0 15px;padding-left:22px}
.doc li{margin-bottom:5px}
.doc code{font-family:var(--mono);font-size:.84em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.doc pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
.doc pre code{background:none;padding:0;font-size:12px}
.doc hr{border:none;border-top:1px solid var(--line);margin:24px 0}
.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:12.5px}
.doc th,.doc td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.doc th{background:var(--surface-2);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.doc tr:last-child td{border-bottom:none}
.doc td{font-variant-numeric:tabular-nums}
.libcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 15px;
  text-decoration:none;color:inherit}
.libcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.libcard .n{font-family:var(--sans);font-size:13.5px;font-weight:600;margin-bottom:3px}
.libcard .d{font-family:var(--sans);font-size:12px;color:var(--muted);line-height:1.4}
.loading{font-family:var(--mono);font-size:12px;color:var(--muted);padding:34px 0}
.empty{font-family:var(--sans);font-size:13px;color:var(--muted);padding:12px 0}

.backup{display:none}
@media (max-width:1040px){
  .day{grid-template-columns:minmax(0,1fr)}
  .det{position:static;scroll-margin-top:64px}
  .tl{scroll-margin-top:64px}
  .backup{display:inline-block;margin-bottom:12px}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(84vw,280px);z-index:70;transform:translateX(-100%);
    transition:transform .2s ease;height:100%}
  .rail.on{transform:none}
  .burger{display:inline-block}
  .page{padding:24px 16px 96px}
  .sheet{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  <div class="sheet-b" id="sheet-body"></div>
</div>

<script>
(function(){
"use strict";

/* ---------------- reference library ---------------- */
var LIB = [
  {g:"The programme", id:"start",    t:"Read this first",        f:"content/00_read_first.md",       d:"The five open questions and the assumptions the calendar rests on."},
  {g:"The programme", id:"criteria", t:"Success criteria",       f:"content/01_success_criteria.md", d:"How each question gets answered and what done looks like."},
  {g:"The programme", id:"calendar", t:"Calendar and deadlines", f:"content/02_master_calendar.md",  d:"Every date to 18 October and the deadline register."},
  {g:"The programme", id:"prep",     t:"Preparation in full",    f:"content/03_preparation.md",      d:"The four evenings, task by task, with fallbacks."},
  {g:"The workshop",  id:"sat",      t:"Saturday runbooks",      f:"content/04_day1.md",             d:"The written source for every Saturday session."},
  {g:"The workshop",  id:"sun",      t:"Sunday runbooks",        f:"content/05_day2.md",             d:"The written source for Sunday, with the flight variants."},
  {g:"The workshop",  id:"proto",    t:"Prototype plan",         f:"content/06_prototype_plan.md",   d:"Scope lock, build brief, checkpoints and the cut list."},
  {g:"The workshop",  id:"templates",t:"Templates",              f:"content/07_templates.md",        d:"Copy-ready forms, T0 to T12."},
  {g:"The programme", id:"after",    t:"After the workshop",     f:"content/08_follow_through.md",   d:"The final review and the dated week that follows."},
  {g:"Evidence",      id:"compet",   t:"Duel and alternatives",  f:"content/09_competitive.md",      d:"What Duel publicly offers and where Sway could differ."},
  {g:"Evidence",      id:"context",  t:"Context audit",          f:"content/10_context_audit.md",    d:"What is settled, what is assumed, the tensions."},
  {g:"Evidence",      id:"audit",    t:"Programme audit",        f:"content/11_programme_audit.md",  d:"Timings, workload and known limitations."},
  {g:"Evidence",      id:"brief",    t:"Your brief",             f:"content/00_BRIEF.md",            d:"The instructions this programme was built from."},
  {g:"Research",      id:"r1", t:"Duel: public offering",        f:"content/research/duel_public_offering.md",   d:"Capabilities, customers and funding, with sources."},
  {g:"Research",      id:"r2", t:"Duel: customer evidence",      f:"content/research/duel_customer_evidence.md", d:"What brands praise and struggle with."},
  {g:"Research",      id:"r3", t:"Alternatives landscape",       f:"content/research/alternatives_landscape.md", d:"What a customer could choose instead."},
  {g:"Research",      id:"r4", t:"Prototype feasibility",        f:"content/research/prototype_feasibility.md",  d:"Tools, QR, wallet, affiliate links, data model."},
  {g:"Research",      id:"r5", t:"Barcelona logistics",          f:"content/research/logistics.md",              d:"Flights, transfers, the cutoff rule, venue."},
  {g:"Research",      id:"r6", t:"Context audit (long)",         f:"content/research/context_audit.md",          d:"The full audit of the Sway source documents."},
  {g:"Research",      id:"r7", t:"Investor lens",                f:"content/research/investor_lens.md",          d:"What a seed investor needs to believe."},
  {g:"Challenge",     id:"c1", t:"Consumer behaviour",           f:"content/research/challenge_consumer-behaviour.md", d:"Will anyone build a Locker and scan a Pass?"},
  {g:"Challenge",     id:"c2", t:"The brand buyer",              f:"content/research/challenge_brand-buyer.md",  d:"Would a wellness brand buy this, and from which budget?"},
  {g:"Challenge",     id:"c3", t:"The investor",                 f:"content/research/challenge_investor-skeptic.md", d:"Why is this not a feature of ShopMy, LTK or Duel?"},
  {g:"Design",        id:"d1", t:"Final skeleton",               f:"content/design/FINAL_SKELETON.md",           d:"The structure the programme was written from."},
  {g:"Design",        id:"d2", t:"Resolution plan",              f:"content/design/RESOLUTION_PLAN.md",          d:"How the audit findings were reconciled."},
  {g:"Design",        id:"d3", t:"Candidate: decision-first",    f:"content/design/skeleton_decision-first.md",  d:"Optimised for the quality of the answers."},
  {g:"Design",        id:"d4", t:"Candidate: build-first",       f:"content/design/skeleton_build-first.md",     d:"Optimised for a demonstrable prototype."},
  {g:"Design",        id:"d5", t:"Candidate: evidence-first",    f:"content/design/skeleton_evidence-first.md",  d:"Optimised for not fooling ourselves."}
];

/* ---------------- state ---------------- */
var DATA = {};
var db = null, userCap = null, me = {id:null,name:""}, canWrite = true, syncMode = "connecting";
var store = {workbook:{}, ticks:{}, decisions:[], notes:[], run:{}};
var profiles = {};
var docCache = {};
var view = {name:"brief"};
var tickHandle = null;
var jumpToDetail = false;

function $(s){return document.querySelector(s);}
function setText(e,x){
  var s=String(x);
  if(s.indexOf("`")<0){ e.textContent=s; return e; }
  var parts=s.split("`");
  for(var i=0;i<parts.length;i++){
    if(!parts[i]) continue;
    if(i%2===1){ var cd=document.createElement("code"); cd.textContent=parts[i]; e.appendChild(cd); }
    else e.appendChild(document.createTextNode(parts[i]));
  }
  return e;
}
function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) setText(e,x); return e;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mins(n){ if(n<60) return n+" min"; var h=Math.floor(n/60), m=n%60; return m? h+"h "+m+"m" : h+" hours"; }
function toMin(hhmm){var p=String(hhmm).split(":");return (+p[0])*60+(+p[1]);}
function pad(n){return n<10?"0"+n:""+n;}
function fmtClock(ms){var s=Math.max(0,Math.round(ms/1000));return pad(Math.floor(s/60))+":"+pad(s%60);}
function whenStr(iso){ if(!iso) return ""; try{var d=new Date(iso);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});}catch(e){return "";} }
function whoName(id){ if(!id) return "Someone"; if(id===me.id) return me.name||"You";
  var p=profiles[id]; return (p&&p.name)||"Your co-founder"; }
function lget(k){try{var v=localStorage.getItem("swayv2:"+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lset(k,v){try{localStorage.setItem("swayv2:"+k,JSON.stringify(v));}catch(e){}}

/* ---------------- capabilities ---------------- */
function setSync(m,t){ syncMode=m; var d=$("#syncdot"); d.className="dot"+(m==="live"?" live":m==="local"?" local":""); $("#syncmsg").textContent=t; }
function initCaps(){
  if(!window.claude||!window.claude.use){ setSync("local","saved on this device"); hydrate(); return; }
  var to=setTimeout(function(){ if(syncMode==="connecting"){ setSync("local","saved on this device"); hydrate(); } },11000);
  Promise.resolve(window.claude.use("user")).then(function(u){
    userCap=u; if(!u) return;
    return u.me().then(function(v){ me={id:v.id,name:v.name}; return u.can("data.write"); })
      .then(function(w){ if(w===false) canWrite=false; });
  }).catch(function(){});
  Promise.resolve(window.claude.use("db")).then(function(d){
    clearTimeout(to);
    if(!d){ setSync("local","saved on this device"); hydrate(); return; }
    db=d; setSync("live","shared and live"); subscribe();
  }).catch(function(){ clearTimeout(to); setSync("local","saved on this device"); hydrate(); });
}
function hydrate(){
  store.workbook=lget("workbook")||{}; store.ticks=lget("ticks")||{};
  store.decisions=lget("decisions")||[]; store.notes=lget("notes")||[]; store.run=lget("run")||{};
  render();
}
function subscribe(){
  try{
    db.collection("workbook").onSnapshot(function(s){
      var n={}; s.docs.forEach(function(d){n[d.id]=d.data()||{};});
      Object.keys(sealedIds).forEach(function(k){ if(store.workbook[k]) n[k]=store.workbook[k]; });
      store.workbook=n; refreshFields();
    },function(){});
    db.collection("ticks").onSnapshot(function(s){
      var n={}; s.docs.forEach(function(d){n[d.id]=d.data()||{};}); store.ticks=n; refreshTicks();
    },function(){});
    db.collection("decisions").orderBy("at","desc").limit(200).onSnapshot(function(s){
      var n=[]; s.docs.forEach(function(d){var v=d.data()||{};v._id=d.id;n.push(v);}); store.decisions=n;
      resolveProfiles(n.map(function(x){return x.by;})); if(view.name==="outputs") render();
    },function(){});
    db.collection("notes").orderBy("at","desc").limit(300).onSnapshot(function(s){
      var n=[]; s.docs.forEach(function(d){var v=d.data()||{};v._id=d.id;n.push(v);}); store.notes=n;
      resolveProfiles(n.map(function(x){return x.by;})); renderNotes();
    },function(){});
    db.doc("run/state").onSnapshot(function(d){
      store.run=(d.exists?d.data():{})||{}; onRunState();
    },function(){});
  }catch(e){ setSync("local","saved on this device"); hydrate(); }
}
function resolveProfiles(ids){
  ids=ids.filter(Boolean); if(!userCap||!ids.length) return;
  userCap.profiles(ids).then(function(p){ profiles=p; });
}
var pend={};
var sealedIds = {};
function saveField(id,val,dot){
  store.workbook[id]={value:val,by:me.id,at:new Date().toISOString()};
  lset("workbook",store.workbook);
  if(dot) dot.className="sd p";
  clearTimeout(pend[id]);
  pend[id]=setTimeout(function(){
    if(sealedIds[id]){ if(dot) dot.className="sd ok"; return; }
    if(!db||!canWrite){ if(dot) dot.className="sd ok"; return; }
    db.doc("workbook/"+id).set({value:val,by:me.id||"",at:new Date().toISOString()})
      .then(function(){ if(dot) dot.className="sd ok"; })
      .catch(function(e){ if(e&&e.code==="invalid_argument"){canWrite=false;setSync("local","read only, saved here");} if(dot) dot.className="sd"; });
  },700);
}
function setTick(id,on){
  store.ticks[id]={done:on,by:me.id,at:new Date().toISOString()}; lset("ticks",store.ticks);
  if(db&&canWrite) db.doc("ticks/"+id).set({done:on,by:me.id||"",at:new Date().toISOString()}).catch(function(){});
  refreshTicks();
}
function isTicked(id){ var r=store.ticks[id]; return !!(r&&r.done); }
function addDecision(d){
  var rec={text:d.text,label:d.label,owner:d.owner,trigger:d.trigger,by:me.id||"",at:new Date().toISOString()};
  if(db&&canWrite){ db.collection("decisions").add(rec).catch(function(){}); }
  else { rec._id="l"+Math.random().toString(36).slice(2); store.decisions.unshift(rec); lset("decisions",store.decisions); render(); }
}
function addNote(section,body){
  var rec={section:section,body:body,by:me.id||"",at:new Date().toISOString()};
  if(db&&canWrite){ db.collection("notes").add(rec).catch(function(){}); }
  else { rec._id="l"+Math.random().toString(36).slice(2); store.notes.unshift(rec); lset("notes",store.notes); renderNotes(); }
}
function saveRun(state){
  store.run=state; lset("run",state);
  if(db&&canWrite) db.doc("run/state").set(state).catch(function(){});
  onRunState();
}

/* ---------------- timer ---------------- */
function runElapsed(){
  var r=store.run||{}; if(!r.startedAt) return 0;
  var base=r.accumulated||0;
  if(!r.running) return base;
  return base + (Date.now() - new Date(r.startedAt).getTime());
}
function onRunState(){
  paintTimer();
  var sel=document.querySelector(".tl-item.now");
  if(sel) sel.classList.add("now");
  if(view.name==="day") markTimeline();
}
function paintTimer(){
  var box=document.getElementById("timerbox"); if(!box) return;
  var s=currentSession(); if(!s) return;
  var r=store.run||{};
  var active=r.sessionId===s.id;
  var ms=active?runElapsed():0;
  var total=s.minutes*60000;
  var cl=box.querySelector(".clock"), fill=box.querySelector(".fill"), lbl=box.querySelector(".lbl");
  var over=ms>total;
  cl.textContent=fmtClock(ms); cl.className="clock"+(over?" over":"");
  fill.style.width=Math.min(100,(ms/total)*100)+"%"; fill.className="fill"+(over?" over":"");
  lbl.textContent=active
    ? (over? "over by "+fmtClock(ms-total)+" of "+s.minutes+" min" : fmtClock(total-ms)+" left of "+s.minutes+" min")
    : s.minutes+" minutes planned";
  var pb=box.querySelector("#playbtn");
  if(pb) pb.textContent = (active&&r.running)?"Pause":(active?"Resume":"Start session");
  var steps=document.querySelectorAll(".step[data-min]");
  if(steps.length && active){
    var mark=ms/60000, acc={}, found={};
    for(var i=0;i<steps.length;i++){
      var tr=steps[i].dataset.track||"solo";
      if(!(tr in acc)) acc[tr]=0;
      acc[tr]+=+steps[i].dataset.min;
      if(!(tr in found) && mark<acc[tr]) found[tr]=i;
    }
    for(var j=0;j<steps.length;j++){
      var t2=steps[j].dataset.track||"solo";
      steps[j].classList.toggle("cur", found[t2]===j);
    }
  }
}
function startTicking(){ if(tickHandle) return; tickHandle=setInterval(paintTimer,1000); }
function stopTicking(){ if(tickHandle){clearInterval(tickHandle); tickHandle=null;} }

/* ---------------- sessions ---------------- */
function dayData(id){ return DATA[id]; }
function allSessions(id){ var d=dayData(id); return d?d.sessions:[]; }
function findSession(dayId,sid){ return allSessions(dayId).filter(function(s){return s.id===sid;})[0]; }
function currentSession(){ if(view.name!=="day"||!view.sid) return null; return findSession(view.day,view.sid); }
function nowInfo(){
  var n=new Date(), iso=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate());
  var dayId = iso==="2026-10-10" ? "sat" : iso==="2026-10-11" ? "sun" : null;
  return {dayId:dayId, minutes:n.getHours()*60+n.getMinutes()};
}
function liveSessionId(dayId){
  var ni=nowInfo(); if(ni.dayId!==dayId) return null;
  var list=allSessions(dayId);
  for(var i=0;i<list.length;i++){ if(ni.minutes>=toMin(list[i].start)&&ni.minutes<toMin(list[i].end)) return list[i].id; }
  return null;
}

/* ---------------- shell ---------------- */
function buildRail(){
  var n=$("#railnav"); n.innerHTML="";
  function add(href,label,badge,group){
    if(group){ n.appendChild(el("div","gl",group)); }
    var a=el("a"); a.href=href; a.dataset.k=href;
    a.appendChild(el("span",null,label));
    if(badge){ a.appendChild(el("span","badge",badge)); }
    n.appendChild(a);
  }
  add("#/brief","Brief",null,"Before");
  add("#/prepare","Prepare","4 evenings");
  add("#/day/sat","Saturday","09:00 to 18:30","In Barcelona");
  add("#/day/sun","Sunday","09:00 to 14:30");
  add("#/proto","Prototype");
  add("#/outputs","Outputs",null,"The record");
  add("#/library","Reference");
}
function markRail(){
  var key = view.name==="day" ? "#/day/"+view.day
    : view.name==="doc" ? "#/library" : "#/"+view.name;
  Array.prototype.forEach.call(document.querySelectorAll(".railnav a"),function(a){
    a.classList.toggle("on", a.dataset.k===key);
  });
}
function parseHash(){
  var h=location.hash.replace(/^#\/?/,""); if(!h) return {name:"brief"};
  var p=h.split("/");
  if(p[0]==="day") return {name:"day", day:(p[1]==="sun"?"sun":"sat"), sid:p[2]||null};
  if(p[0]==="doc") return {name:"doc", id:p[1]};
  if(["brief","prepare","outputs","library","proto"].indexOf(p[0])>-1) return {name:p[0]};
  return {name:"brief"};
}
function go(hash){ location.hash=hash; }

/* ---------------- fields ---------------- */
function fieldEl(f, idPrefix){
  var id=(idPrefix||"")+f.id;
  if(f.private) sealedIds[id]=true;
  var wrap=el("div","field"+(f.private?" sealed":""));

function loadDoc(f){
  if(docCache[f]) return Promise.resolve(docCache[f]);
  return fetch(f).then(function(r){ if(!r.ok) throw new Error("x"); return r.text(); })
    .then(function(t){ docCache[f]=t; return t; });
}

/* --- notes --- */
function notes(host,section){
  var s=el("section","sec"); s.id="notes"; s.dataset.sec=section;
  s.appendChild(el("div","kicker","Notes between the two of you"));
  var c=el("div","card pad");
  var ta=el("textarea"); ta.rows=2; ta.placeholder="Leave a note here. Whoever opens this page next sees it.";
  c.appendChild(ta);
  var b=el("button","btn sm","Post"); b.style.marginTop="8px";
  b.addEventListener("click",function(){ var v=ta.value.trim(); if(!v) return; addNote(section,v); ta.value=""; });
  c.appendChild(b);
  var list=el("div"); list.id="notelist"; list.style.marginTop="14px"; c.appendChild(list);
  s.appendChild(c); host.appendChild(s);
  renderNotes();
}
function renderNotes(){
  var s=document.getElementById("notes"), l=document.getElementById("notelist");
  if(!s||!l) return;
  var items=store.notes.filter(function(n){return n.section===s.dataset.sec;});
  l.innerHTML="";
  if(!items.length){ l.appendChild(el("p","empty","No notes here yet.")); return; }
  items.forEach(function(n){
    var row=el("div"); row.style.cssText="padding:9px 0;border-bottom:1px solid var(--line)";
    var h=el("div","sub"); h.style.marginBottom="2px";
    h.textContent=whoName(n.by)+"  ·  "+whenStr(n.at);
    if(!n.by||n.by===me.id){
      var x=el("button",null,"delete");
      x.style.cssText="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;margin-left:8px";
      x.addEventListener("click",function(){
        if(db&&canWrite&&n._id&&n._id.charAt(0)!=="l") db.doc("notes/"+n._id).delete().catch(function(){});
        else { store.notes=store.notes.filter(function(z){return z._id!==n._id;}); lset("notes",store.notes); renderNotes(); }
      });
      h.appendChild(x);
    }
    row.appendChild(h);
    var t=el("div",null,n.body); t.style.cssText="font-family:var(--sans);font-size:13.5px;white-space:pre-wrap";
    row.appendChild(t); l.appendChild(row);
  });
}

/* --- sheet --- */
function openSheet(head,body){
  var sh=$("#sheet"), sc=$("#scrim");
  $("#sheet-head").innerHTML=""; $("#sheet-head").appendChild(head);
  $("#sheet-body").innerHTML=""; $("#sheet-body").appendChild(body);
  sh.hidden=false; sc.hidden=false;
  requestAnimationFrame(function(){ sh.classList.add("on"); sc.classList.add("on"); });
  refreshFields(); refreshTicks();
}
function closeSheet(){
  var sh=$("#sheet"), sc=$("#scrim");
  sh.classList.remove("on"); sc.classList.remove("on");
  setTimeout(function(){ sh.hidden=true; sc.hidden=true; },200);
}

/* --- markdown (reference reader) --- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[^"\w])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  return s;
}
function cells(line){ return line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();}); }
function mdToHtml(md){
  var fences=[];
  md=md.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,l,c){
    var i=fences.length;
    fences.push(l==="mermaid"?'<pre class="mermaid">'+esc(c)+"</pre>":"<pre><code>"+esc(c)+"</code></pre>");
    return "F"+i+"";
  });
  var L=md.split("\n"), out=[], i=0;
  while(i<L.length){
    var l=L[i];
    if(/^\s*$/.test(l)){i++;continue;}
    var f=l.match(/^F(\d+)$/); if(f){out.push(fences[+f[1]]);i++;continue;}
    var h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ var lv=Math.min(Math.max(h[1].length,2),6);
      out.push("<h"+lv+">"+inline(h[2])+"</h"+lv+">"); i++; continue; }
    if(/^(-{3,})\s*$/.test(l)){out.push("<hr>");i++;continue;}
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])&&L[i+1].indexOf("-")>-1){
      var head=cells(l), rows=[]; i+=2;
      while(i<L.length&&/^\s*\|/.test(L[i])){ rows.push(cells(L[i])); i++; }
      var t='<div class="tw"><table><thead><tr>';
      head.forEach(function(c){t+="<th>"+inline(c)+"</th>";});
      t+="</tr></thead><tbody>";
      rows.forEach(function(r){ t+="<tr>"; for(var c=0;c<head.length;c++) t+="<td>"+inline(r[c]||"")+"</td>"; t+="</tr>"; });
      out.push(t+"</tbody></table></div>"); continue;
    }
    if(/^\s*([-*+])\s+/.test(l)){
      var it=[]; while(i<L.length&&/^\s*([-*+])\s+/.test(L[i])){ it.push(inline(L[i].replace(/^\s*([-*+])\s+/,""))); i++; }
      out.push("<ul><li>"+it.join("</li><li>")+"</li></ul>"); continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      var oi=[]; while(i<L.length&&/^\s*\d+\.\s+/.test(L[i])){ oi.push(inline(L[i].replace(/^\s*\d+\.\s+/,""))); i++; }
      out.push("<ol><li>"+oi.join("</li><li>")+"</li></ol>"); continue;
    }
    var para=[];
    while(i<L.length&&!/^\s*$/.test(L[i])&&!/^#{1,6}\s/.test(L[i])&&!/^\s*\|/.test(L[i])&&
          !/^\s*([-*+])\s+/.test(L[i])&&!/^\s*\d+\.\s+/.test(L[i])&&!/^F\d+$/.test(L[i])&&!/^(-{3,})\s*$/.test(L[i])){
      para.push(L[i]); i++;
    }
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  return out.join("\n");
}

/* ---------------- boot ---------------- */
function boot(){
  buildRail();
  Promise.all(["brief","prep","sat","sun","proto"].map(function(k){
    return fetch("data/"+k+".json").then(function(r){ if(!r.ok) throw new Error(k); return r.json(); })
      .then(function(j){ DATA[k]=j; }).catch(function(){ DATA[k]=null; });
  })).then(function(){
    if(!DATA.brief&&!DATA.sat){
      $("#page").innerHTML='<p class="loading">The programme data could not be loaded. Reload the page.</p>';
      return;
    }
    if(DATA.prep){
      (DATA.prep.evenings||[]).forEach(function(ev){
        (ev.tasks||[]).forEach(function(t){
          (t.capture||[]).forEach(function(c){ if(c.private) sealedIds["prep-"+c.id]=true; });
        });
      });
    }
    var ni=nowInfo();
    if(!location.hash && ni.dayId && DATA[ni.dayId]) location.hash="#/day/"+ni.dayId;
    render(); initCaps();
  });
}
window.addEventListener("hashchange",render);

  var id=liveSessionId(ni.dayId); go("#/day/"+ni.dayId+(id?"/"+id:""));
});
$("#themebtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="dark"?"light":cur==="light"?"dark":
    (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next); lset("theme",next);
});
var th=lget("theme"); if(th) document.documentElement.setAttribute("data-theme",th);
boot();
})();
