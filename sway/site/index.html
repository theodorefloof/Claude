<title>Sway Barcelona Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f6f6f3;
  --surface:#ffffff;
  --surface-2:#f0f0ec;
  --ink:#16181d;
  --ink-2:#3d434c;
  --muted:#6e747d;
  --line:#dddcd5;
  --line-strong:#c6c5bc;
  --accent:#1f5f4f;
  --accent-soft:#e4efea;
  --flag:#a8431d;
  --flag-soft:#f7e9e2;
  --focus:#1f5f4f;
  --shadow:0 1px 2px rgba(22,24,29,.06),0 8px 24px -16px rgba(22,24,29,.35);
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101216;
    --surface:#171a20;
    --surface-2:#1e222a;
    --ink:#e8e9e4;
    --ink-2:#c3c6c2;
    --muted:#8d949d;
    --line:#2a2f38;
    --line-strong:#3a414c;
    --accent:#63c0a4;
    --accent-soft:#16302a;
    --flag:#e0834f;
    --flag-soft:#33211a;
    --focus:#63c0a4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#101216;
  --surface:#171a20;
  --surface-2:#1e222a;
  --ink:#e8e9e4;
  --ink-2:#c3c6c2;
  --muted:#8d949d;
  --line:#2a2f38;
  --line-strong:#3a414c;
  --accent:#63c0a4;
  --accent-soft:#16302a;
  --flag:#e0834f;
  --flag-soft:#33211a;
  --focus:#63c0a4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;border-radius:2px
}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}

/* ---------- sidebar ---------- */
.side{
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden
}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--sans);font-size:15px;letter-spacing:.02em;margin:0 0 4px;font-weight:700}
.brand p{margin:0;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
.countdown{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.pill{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:3px 7px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)
}
.pill.go{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.stop{background:var(--flag-soft);color:var(--flag);border-color:transparent}
.searchwrap{padding:12px 14px;border-bottom:1px solid var(--line)}
.searchwrap input{
  width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;
  background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px
}
.nav{overflow-y:auto;padding:10px 8px 28px;flex:1}
.navgroup{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav a{
  display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:6px;
  font-family:var(--sans);font-size:13.5px;color:var(--ink-2);text-decoration:none;line-height:1.35
}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .num{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:20px}
.nav a.active .num{color:var(--accent)}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 24px
}
.topbar .where{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--accent)}
.dot.local{background:var(--flag)}
.iconbtn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  font-family:var(--sans);font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer
}
.iconbtn:hover{background:var(--surface-2)}
.menubtn{display:none}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:28px 24px 96px}
.doc{max-width:74ch}
.doc.wide{max-width:none}

/* ---------- prose ---------- */
.doc h2{font-family:var(--sans);font-size:26px;line-height:1.2;font-weight:700;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.doc h3{font-family:var(--sans);font-size:17px;font-weight:600;margin:34px 0 8px;text-wrap:balance;
  padding-top:14px;border-top:1px solid var(--line)}
.doc h4{font-family:var(--sans);font-size:14.5px;font-weight:600;margin:22px 0 6px}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 16px;padding-left:22px}
.doc li{margin:0 0 6px}
.doc li::marker{color:var(--muted)}
.doc strong{font-weight:600}
.doc code{font-family:var(--mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--ink-2)}
.doc pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
.doc pre.code code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.doc hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.doc blockquote{margin:0 0 16px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);color:var(--ink-2)}
.tablewrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:12.5px;line-height:1.45}
.doc th,.doc td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.doc th{background:var(--surface-2);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;position:sticky;top:0}
.doc tr:last-child td{border-bottom:none}
.doc td{font-variant-numeric:tabular-nums}
.doc td:first-child{white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.doc table.freeform td:first-child{white-space:normal;font-family:var(--sans);font-size:12.5px}
.doc .mermaid{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto;margin:0 0 20px}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 22px;box-shadow:var(--shadow)}
.panel h3{font-family:var(--sans);font-size:15px;font-weight:600;margin:0 0 4px;border:none;padding:0}
.panel .hint{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:0 0 14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 24px}
.glance div{background:var(--surface);padding:13px 14px}
.glance dt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.glance dd{margin:0;font-family:var(--sans);font-size:14px;font-weight:600;line-height:1.3}
.glance dd small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--sans)}

.field{margin:0 0 18px}
.field label{display:block;font-family:var(--sans);font-size:13px;font-weight:600;margin:0 0 3px}
.field .q{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:0 0 7px}
textarea,input[type="text"]{
  width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:13.5px;line-height:1.55;padding:10px 12px;resize:vertical
}
textarea{min-height:82px}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center;min-height:14px}
.savedot{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.savedot.pending{background:var(--flag)}
.savedot.ok{background:var(--accent)}

.tasks{display:flex;flex-direction:column;gap:2px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:20px 0 6px}
.dayhead h4{margin:0;font-family:var(--sans);font-size:14px;font-weight:600}
.dayhead span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:7px;border:1px solid transparent}
.task:hover{background:var(--surface-2)}
.task input{margin:3px 0 0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.task .body{flex:1;min-width:0}
.task .t{font-family:var(--sans);font-size:13.5px;line-height:1.4}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.who{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:2px 6px;border-radius:4px;flex:none;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.who.b{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.who.t{background:var(--flag-soft);color:var(--flag);border-color:transparent}

.notes{margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.note{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.note:last-of-type{border-bottom:none}
.avatar{width:26px;height:26px;border-radius:50%;flex:none;background:var(--surface-2)}
.note .n-body{flex:1;min-width:0}
.note .n-head{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:2px;display:flex;gap:8px;align-items:center}
.note .n-text{font-family:var(--sans);font-size:13.5px;white-space:pre-wrap;word-wrap:break-word}
.note button{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:10.5px;cursor:pointer;padding:0}
.note button:hover{color:var(--flag)}
.row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:13px;font-weight:600;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;
  background:var(--accent);color:#fff
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-strong)}
.btn:disabled{opacity:.5;cursor:default}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0 0 26px}
.card{
  display:block;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 14px;
  text-decoration:none;color:inherit
}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .n{font-family:var(--sans);font-size:13.5px;font-weight:600;margin:5px 0 3px;line-height:1.3}
.card .d{font-family:var(--sans);font-size:12px;color:var(--muted);line-height:1.4}
.toc{font-family:var(--sans);font-size:12.5px;border-left:2px solid var(--line);padding-left:14px;margin:0 0 26px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}
.toc a:hover{color:var(--accent)}
.banner{
  background:var(--flag-soft);border:1px solid color-mix(in srgb,var(--flag) 30%,transparent);color:var(--flag);
  border-radius:8px;padding:10px 14px;font-family:var(--sans);font-size:12.5px;margin:0 0 20px
}
.loading{font-family:var(--mono);font-size:12px;color:var(--muted);padding:40px 0}
.result{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;
  display:block;text-decoration:none;color:inherit}
.result:hover{border-color:var(--line-strong)}
.result .r-t{font-family:var(--sans);font-size:13px;font-weight:600}
.result .r-s{font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:3px}
.result mark{background:var(--accent-soft);color:var(--accent);padding:0 2px;border-radius:2px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);z-index:40;transform:translateX(-100%);
    transition:transform .2s ease;height:100%}
  .side.open{transform:none}
  .menubtn{display:inline-block}
  .wrap{padding:22px 16px 80px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="layout">
  <aside class="side" id="side">
    <div class="brand">
      <h1>Sway, Barcelona</h1>
      <p>10 and 11 October 2026</p>
      <div class="countdown">
        <span class="pill go" id="pill-prep">Planning week: 5 to 8 Oct</span>
        <span class="pill stop">Sunday hard stop 14:30</span>
      </div>
    </div>
    <div class="searchwrap">
      <input type="text" id="search" placeholder="Search the programme" autocomplete="off" aria-label="Search the programme">
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main">
    <div class="topbar">
      <button class="iconbtn menubtn" id="menubtn" aria-label="Open navigation">Menu</button>

      <button class="iconbtn" id="themebtn" aria-label="Switch theme">Theme</button>
    </div>
    <div class="wrap" id="wrap"></div>
  </main>
</div>

<script>
(function(){
"use strict";

/* ============================ content manifest ============================ */
var DOCS = [
  {id:"start",     num:"",    title:"Start here",             group:"The programme", file:"content/00_read_first.md",        desc:"What this is, the five questions to answer, and the assumptions the calendar rests on."},
  {id:"criteria",  num:"1",   title:"Success criteria",       group:"The programme", file:"content/01_success_criteria.md",  desc:"How the five questions get answered, and what done looks like."},
  {id:"calendar",  num:"2",   title:"Calendar and deadlines", group:"The programme", file:"content/02_master_calendar.md",   desc:"Every date from now to 18 October, and the deadline register."},
  {id:"prep",      num:"3",   title:"Preparation",            group:"The programme", file:"content/03_preparation.md",       desc:"The four planning evenings, task by task."},
  {id:"sat",       num:"4A",  title:"Saturday 10 Oct",        group:"The workshop",  file:"content/04_day1.md",              desc:"Schedule and a runbook for every session."},
  {id:"sun",       num:"4B",  title:"Sunday 11 Oct",          group:"The workshop",  file:"content/05_day2.md",              desc:"Schedule to the travel cutoff, variants, and the final review."},
  {id:"proto",     num:"5",   title:"Prototype plan",         group:"The workshop",  file:"content/06_prototype_plan.md",    desc:"Scope lock, build brief, checkpoints and the cut list."},
  {id:"templates", num:"6",   title:"Templates",              group:"The workshop",  file:"content/07_templates.md",         desc:"Copy-ready forms for every artefact, T0 to T12."},
  {id:"after",     num:"7",   title:"After the workshop",     group:"The programme", file:"content/08_follow_through.md",    desc:"The final review and the dated week that follows."},
  {id:"compet",    num:"8",   title:"Duel and alternatives",  group:"Evidence",      file:"content/09_competitive.md",       desc:"What Duel publicly offers, and where Sway could differ."},
  {id:"context",   num:"9",   title:"Context audit",          group:"Evidence",      file:"content/10_context_audit.md",     desc:"What is settled, what is assumed, and the tensions to resolve."},
  {id:"audit",     num:"10",  title:"Programme audit",        group:"Evidence",      file:"content/11_programme_audit.md",   desc:"Timings, workload, dependencies and known limitations."}
];
var LIBRARY = [
  {k:"Brief",    id:"brief",        title:"The brief",                      file:"content/00_BRIEF.md",                       d:"Your instructions and constraints, restated."},
  {k:"Research", id:"r-duel",       title:"Duel: public offering",          file:"content/research/duel_public_offering.md",   d:"What Duel demonstrably offers, with sources and evidence grades."},
  {k:"Research", id:"r-customers",  title:"Duel: customer evidence",        file:"content/research/duel_customer_evidence.md", d:"What brands praise and struggle with, from public reviews."},
  {k:"Research", id:"r-alts",       title:"Alternatives landscape",         file:"content/research/alternatives_landscape.md", d:"What a customer could choose instead, on both sides of the market."},
  {k:"Research", id:"r-proto",      title:"Prototype feasibility",          file:"content/research/prototype_feasibility.md",  d:"Tool choice, QR, wallet, affiliate links, data model, build sequence."},
  {k:"Research", id:"r-logistics",  title:"Barcelona logistics",            file:"content/research/logistics.md",              d:"Flights, transfers, the cutoff rule, venue, dinner and weather."},
  {k:"Research", id:"r-context",    title:"Context audit (full)",           file:"content/research/context_audit.md",          d:"The long-form audit of the Sway source documents."},
  {k:"Research", id:"r-investor",   title:"Investor lens",                  file:"content/research/investor_lens.md",          d:"What a seed investor needs to believe, slide by slide."},
  {k:"Challenge",id:"c-consumer",   title:"Challenge: consumer behaviour",  file:"content/research/challenge_consumer-behaviour.md", d:"Will anyone build a Locker and scan a Pass?"},
  {k:"Challenge",id:"c-brand",      title:"Challenge: the brand buyer",     file:"content/research/challenge_brand-buyer.md",  d:"Would a wellness brand actually buy this, and from which budget?"},
  {k:"Challenge",id:"c-investor",   title:"Challenge: the investor",        file:"content/research/challenge_investor-skeptic.md", d:"Why is this not a feature of ShopMy, LTK or Duel?"},
  {k:"Design",   id:"d-final",      title:"Final skeleton",                 file:"content/design/FINAL_SKELETON.md",           d:"The agreed structure the programme was written from."},
  {k:"Design",   id:"d-plan",       title:"Resolution plan",                file:"content/design/RESOLUTION_PLAN.md",          d:"How 166 audit findings were reconciled into one set of values."},
  {k:"Design",   id:"d-s1",         title:"Candidate: decision-first",      file:"content/design/skeleton_decision-first.md",  d:"Optimised for the quality of the five answers."},
  {k:"Design",   id:"d-s2",         title:"Candidate: build-first",         file:"content/design/skeleton_build-first.md",     d:"Optimised for a demonstrable prototype."},
  {k:"Design",   id:"d-s3",         title:"Candidate: evidence-first",      file:"content/design/skeleton_evidence-first.md",  d:"Optimised for not fooling ourselves."}
];
var ALL = DOCS.concat(LIBRARY);

/* the five questions that unblock the calendar */
var QUESTIONS = [
  {id:"q1", label:"1. Flights, checkout and bags",
   q:"Return flight time, airline, number, terminal and whether you check a bag. Accommodation checkout time and whether bags can be held on Sunday."},
  {id:"q2", label:"2. The four planning evenings",
   q:"Which of Mon 5, Tue 6, Wed 7 and Thu 8 October can each of you protect, and can the three admin anchors be done by Fri 25 September?"},
  {id:"q3", label:"3. Which Duel, and what you can gather",
   q:"Confirm Duel means duel.tech, and say which public materials you can screenshot yourselves on the Tuesday evening."},
  {id:"q4", label:"4. Prototype readiness",
   q:"Which build tool and accounts already exist, whether you can open and export the existing clickable prototype and who hosts it, and your two phone models."},
  {id:"q5", label:"5. Your constraints",
   q:"Employment obligations, intellectual property in the existing materials, hours per week, and any budget for the week after. Diligence items to confirm with your own legal advice."}
];

/* the five answers the workshop must produce */
var ANSWERS = [
  {id:"a1", label:"What is Sway?",             q:"Category, target customer, founding insight, positioning, reason to exist. Decided at D1-02, Saturday 09:10. Under 120 words."},
  {id:"a2", label:"What does it do?",          q:"Core experience, primary journey, the outcome, and what belongs in the first product. Decided at D1-05, Saturday 11:10."},

/* ============================ tiny markdown ============================ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,function(m,a){return "<code>"+a+"</code>";});
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,function(m,t,u){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+"</a>";});
  s = s.replace(/(^|[^\w])(https?:\/\/[^\s<)]+)/g,function(m,p,u){return p+'<a href="'+u+'" target="_blank" rel="noopener">'+u+"</a>";});
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return s;
}
function splitRow(line){
  var t = line.trim().replace(/^\|/,"").replace(/\|$/,"");
  return t.split("|").map(function(c){return c.trim();});
}
function mdToHtml(md){
  var fences = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,lang,code){
    var i = fences.length;
    fences.push(lang === "mermaid"
      ? '<pre class="mermaid">'+esc(code)+"</pre>"
      : '<pre class="code"><code>'+esc(code)+"</code></pre>");
    return "F"+i+"";
  });
  var lines = md.split("\n"), out = [], i = 0;
  while(i < lines.length){
    var l = lines[i];
    if(/^\s*$/.test(l)){ i++; continue; }
    var fence = l.match(/^F(\d+)$/);
    if(fence){ out.push(fences[+fence[1]]); i++; continue; }
    var h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){
      var lvl = Math.min(Math.max(h[1].length, 2), 6);
      var txt = h[2].replace(/\s+$/,"");
      var slug = txt.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      out.push("<h"+lvl+' id="s-'+slug+'">'+inline(txt)+"</h"+lvl+">");
      i++; continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1]) && lines[i+1].indexOf("-") > -1){
      var head = splitRow(l), rows = [];
      i += 2;
      while(i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
      var freeform = head.length <= 3;
      var t = '<div class="tablewrap"><table'+(freeform?' class="freeform"':"")+"><thead><tr>";
      head.forEach(function(c){ t += "<th>"+inline(c)+"</th>"; });
      t += "</tr></thead><tbody>";
      rows.forEach(function(r){
        t += "<tr>";
        for(var c = 0; c < head.length; c++){ t += "<td>"+inline(r[c] || "")+"</td>"; }
        t += "</tr>";
      });
      out.push(t+"</tbody></table></div>");
      continue;
    }
    if(/^\s*([-*+])\s+/.test(l)){
      var items = [];
      while(i < lines.length && /^\s*([-*+])\s+/.test(lines[i])){
        items.push(inline(lines[i].replace(/^\s*([-*+])\s+/,"")));
        i++;
      }
      out.push("<ul><li>"+items.join("</li><li>")+"</li></ul>");
      continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      var oitems = [];
      while(i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
        oitems.push(inline(lines[i].replace(/^\s*\d+\.\s+/,"")));
        i++;
      }
      out.push("<ol><li>"+oitems.join("</li><li>")+"</li></ol>");
      continue;
    }
    if(/^>\s?/.test(l)){
      var q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ q.push(inline(lines[i].replace(/^>\s?/,""))); i++; }
      out.push("<blockquote>"+q.join("<br>")+"</blockquote>");
      continue;
    }
    var para = [];
    while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s/.test(lines[i]) &&
          !/^\s*\|/.test(lines[i]) && !/^\s*([-*+])\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
          !/^F\d+$/.test(lines[i]) && !/^(-{3,})\s*$/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  return out.join("\n");
}

var cache = {};        // file -> markdown
var db = null, userCap = null, me = {id:null,name:"",color:""};

function $(s){ return document.querySelector(s); }
function el(tag, cls, text){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function setSync(mode, msg){
  syncMode = mode;
  var d = $("#syncdot");
  d.className = "dot" + (mode === "live" ? " live" : mode === "local" ? " local" : "");
  $("#syncmsg").textContent = msg;
}
function fmtWhen(iso){
  if(!iso) return "";
  try{
    var d = new Date(iso);
    return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}) + " " +
           d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }catch(e){ return ""; }
}
function nameFor(id){
  if(!id) return "Someone";
  if(id === me.id) return me.name || "You";
  var p = profileCache[id];
  return (p && p.name) || "Your co-founder";
}

/* local fallback so typing is never lost when the store is unavailable */
function localGet(key){
  try{ var v = window.localStorage.getItem("sway:"+key); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function localSet(key, val){
  try{ window.localStorage.setItem("sway:"+key, JSON.stringify(val)); }catch(e){}
}

/* ============================ capabilities ============================ */
function initCaps(){
  if(!window.claude || !window.claude.use){
    setSync("local","saved on this device only");
    hydrateLocal();
    return;
  }
  var timer = setTimeout(function(){
    if(syncMode === "connecting"){ setSync("local","saved on this device only"); hydrateLocal(); }
  }, 11000);

  Promise.resolve(window.claude.use("user")).then(function(u){
    userCap = u;
    if(!u) return null;
    return u.me().then(function(v){
      me = {id:v.id, name:v.name, color:v.color};
      return u.can("data.write");
    }).then(function(w){ if(w === false) canWrite = false; });
  }).catch(function(){});

  Promise.resolve(window.claude.use("db")).then(function(d){
    clearTimeout(timer);
    if(!d){ setSync("local","saved on this device only"); hydrateLocal(); return; }
    db = d;
    setSync("live","shared, live");
    subscribe();
  }).catch(function(){
    clearTimeout(timer);
    setSync("local","saved on this device only");
    hydrateLocal();
  });
}
function hydrateLocal(){
  var w = localGet("workbook"); if(w) store.workbook = w;
  var c = localGet("checklist"); if(c) store.checklist = c;
  var n = localGet("notes"); if(n) store.notes = n;
  render();
}
function subscribe(){
  try{
    db.collection("workbook").onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(d){ next[d.id] = d.data() || {}; });
      store.workbook = next;
      refreshFields();
    }, function(){ setSync("local","sync interrupted, saved on this device"); });

    db.collection("checklist").onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(d){ next[d.id] = d.data() || {}; });
      store.checklist = next;
      if(route.view === "prep" || route.view === "doc") refreshChecklist();
    }, function(){});

    db.collection("notes").orderBy("at","desc").limit(200).onSnapshot(function(snap){
      var next = [];
      snap.docs.forEach(function(d){ var v = d.data() || {}; v._id = d.id; next.push(v); });
      store.notes = next;
      var ids = next.map(function(n){ return n.by; }).filter(Boolean);
      if(userCap && ids.length){
        userCap.profiles(ids).then(function(ps){ profileCache = ps; renderNotes(); });
      } else { renderNotes(); }
    }, function(){});
  }catch(e){
    setSync("local","saved on this device only");
    hydrateLocal();
  }
}
var pending = {};
function saveField(id, value, dot){
  store.workbook[id] = {value:value, by:me.id, at:new Date().toISOString()};
  localSet("workbook", store.workbook);
  if(dot) dot.className = "savedot pending";
  clearTimeout(pending[id]);
  pending[id] = setTimeout(function(){
    if(!db || !canWrite){ if(dot) dot.className = "savedot ok"; return; }
    db.doc("workbook/"+id).set({value:value, by:me.id || "", at:new Date().toISOString()})
      .then(function(){ if(dot) dot.className = "savedot ok"; })
      .catch(function(err){
        if(err && err.code === "invalid_argument"){ canWrite = false; setSync("local","read only, saved on this device"); }
        if(dot) dot.className = "savedot";
      });
  }, 700);
}
function toggleTask(id, done){
  store.checklist[id] = {done:done, by:me.id, at:new Date().toISOString()};
  localSet("checklist", store.checklist);
  if(db && canWrite){
    db.doc("checklist/"+id).set({done:done, by:me.id || "", at:new Date().toISOString()}).catch(function(){});
  }
  refreshChecklist();
}
function addNote(section, body){
  var note = {section:section, body:body, by:me.id || "", at:new Date().toISOString()};
  if(db && canWrite){
    db.collection("notes").add(note).catch(function(){});
  } else {
    note._id = "local-" + Math.random().toString(36).slice(2);
    store.notes.unshift(note);
    localSet("notes", store.notes);
    renderNotes();
  }
}
function deleteNote(id){
  if(db && canWrite && id.indexOf("local-") !== 0){
    db.doc("notes/"+id).delete().catch(function(){});
  } else {
    store.notes = store.notes.filter(function(n){ return n._id !== id; });
    localSet("notes", store.notes);
    renderNotes();
  }
}

function markNav(){
  var key = route.view === "doc" ? route.id : "#/" + route.view;
  Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function(a){
    a.classList.toggle("active", a.dataset.id === key);
  });
}
function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  if(!h) return {view:"doc", id:"start"};
  var parts = h.split("/");
  if(parts[0] === "doc") return {view:"doc", id:parts[1] || "start"};
  if(parts[0] === "answers" || parts[0] === "checklist" || parts[0] === "library") return {view:parts[0]};
  return {view:"doc", id:"start"};
}

/* ============================ rendering ============================ */
function render(){
  route = parseHash();
  markNav();
  var wrap = $("#wrap");
  wrap.innerHTML = "";
  $("#side").classList.remove("open");
  $("#scrim").hidden = true;
  if(route.view === "answers")  return renderAnswers(wrap);
  if(route.view === "checklist") return renderChecklist(wrap);
  if(route.view === "library")  return renderLibrary(wrap);
  return renderDoc(wrap, route.id);
}

function fieldBlock(f, prefix){
  var id = prefix + f.id;
  var box = el("div","field");
  var lab = el("label", null, f.label);
  lab.htmlFor = "f-" + id;
  box.appendChild(lab);
  box.appendChild(el("p","q",f.q));
  var ta = el("textarea");
  ta.id = "f-" + id;
  ta.dataset.field = id;
  ta.placeholder = "Type here. It saves as you go and your co-founder sees it.";
  var rec = store.workbook[id];
  ta.value = (rec && rec.value) || "";
  var meta = el("div","meta");
  var dot = el("span","savedot");
  meta.appendChild(dot);
  var who = el("span", null, rec && rec.at ? "last edited by " + nameFor(rec.by) + ", " + fmtWhen(rec.at) : "not started");
  who.dataset.metaFor = id;
  meta.appendChild(who);
  ta.addEventListener("input", function(){
    saveField(id, ta.value, dot);
    who.textContent = "saving";
  });
  box.appendChild(ta);
  box.appendChild(meta);
  return box;
}
function refreshFields(){
  Array.prototype.forEach.call(document.querySelectorAll("textarea[data-field]"), function(ta){
    var id = ta.dataset.field, rec = store.workbook[id];
    if(!rec) return;
    if(document.activeElement !== ta && ta.value !== (rec.value || "")) ta.value = rec.value || "";
    var m = document.querySelector('[data-meta-for="' + id + '"]');
    if(m && document.activeElement !== ta){
      m.textContent = rec.at ? "last edited by " + nameFor(rec.by) + ", " + fmtWhen(rec.at) : "not started";
    }
  });
}

  var host = el("div","doc" + (id === "sat" || id === "sun" || id === "calendar" || id === "prep" ? " wide" : ""));
  host.appendChild(el("p","loading","Loading " + doc.title + "."));
  wrap.appendChild(host);
  notesPanel(wrap, id);

  loadFile(doc.file).then(function(md){
    host.innerHTML = mdToHtml(md);
    var heads = host.querySelectorAll("h3");
    if(heads.length > 2){
      var toc = el("nav","toc");
      toc.setAttribute("aria-label","On this page");
      Array.prototype.forEach.call(heads, function(h){
        var a = el("a",null,h.textContent);
        a.href = "#" + h.id;
        a.addEventListener("click", function(ev){
          ev.preventDefault();
          h.scrollIntoView({behavior:"smooth", block:"start"});
        });
        toc.appendChild(a);
      });
      host.insertBefore(toc, host.children[1] || null);
    }
  }).catch(function(){
    host.innerHTML = '<p class="loading">That file could not be loaded. Try again, or open it in the repository.</p>';
  });
}

function notesPanel(wrap, section){
  var p = el("div","notes");
  p.id = "notes-panel";
  p.dataset.section = section;
  var head = el("div","eyebrow","Notes and feedback on this page");
  p.appendChild(head);
  var ta = el("textarea");
  ta.id = "note-input";
  ta.placeholder = "Leave a note for your co-founder. Everyone opening this page sees it.";
  ta.style.minHeight = "62px";
  p.appendChild(ta);
  var row = el("div","row");
  row.style.marginTop = "8px";
  var btn = el("button","btn","Post note");
  btn.addEventListener("click", function(){
    var v = ta.value.trim();
    if(!v) return;
    addNote(section, v);
    ta.value = "";
  });
  row.appendChild(btn);
  p.appendChild(row);
  var list = el("div");
  list.id = "note-list";
  list.style.marginTop = "14px";
  p.appendChild(list);
  wrap.appendChild(p);
  renderNotes();
}
function renderNotes(){
  var panel = document.getElementById("notes-panel");
  var list = document.getElementById("note-list");
  if(!panel || !list) return;
  var section = panel.dataset.section;
  var items = store.notes.filter(function(n){ return n.section === section; });
  list.innerHTML = "";
  if(!items.length){
    var empty = el("p",null,"No notes on this page yet.");
    empty.style.fontFamily = "var(--sans)";
    empty.style.fontSize = "12.5px";
    empty.style.color = "var(--muted)";
    list.appendChild(empty);
    return;
  }
  items.forEach(function(n){
    var row = el("div","note");
    var av = el("div","avatar");
    var p = profileCache[n.by];
    if(p && p.avatarUrl){
      var img = el("img");
      img.src = p.avatarUrl; img.alt = "";
      img.style.width = "26px"; img.style.height = "26px"; img.style.borderRadius = "50%";
      av.appendChild(img);
    }
    var body = el("div","n-body");
    var head = el("div","n-head");
    head.appendChild(el("span",null,nameFor(n.by)));
    head.appendChild(el("span",null,fmtWhen(n.at)));
    if(!n.by || n.by === me.id){
      var del = el("button",null,"delete");
      del.addEventListener("click", function(){ deleteNote(n._id); });
      head.appendChild(del);
    }
    body.appendChild(head);
    body.appendChild(el("div","n-text",n.body));
    row.appendChild(av); row.appendChild(body);
    list.appendChild(row);
  });
}

/* ============================ files and search ============================ */
function loadFile(path){
  if(cache[path]) return Promise.resolve(cache[path]);
  return fetch(path).then(function(r){
    if(!r.ok) throw new Error("http " + r.status);
    return r.text();
  }).then(function(t){ cache[path] = t; return t; });
}
var searchTimer = null;
function runSearch(q){
  var wrap = $("#wrap");
  if(!q){ render(); return; }
  $("#where").textContent = 'Search: "' + q + '"';
  wrap.innerHTML = "";
  wrap.appendChild(el("div","eyebrow","Results"));
  var host = el("div");
  wrap.appendChild(host);
  host.appendChild(el("p","loading","Searching every document."));
  Promise.all(ALL.map(function(d){
    return loadFile(d.file).then(function(md){ return {d:d, md:md}; }).catch(function(){ return null; });
  })).then(function(all){
    host.innerHTML = "";
    var needle = q.toLowerCase(), hits = 0;
    all.filter(Boolean).forEach(function(x){
      var lines = x.md.split("\n"), found = [];
      for(var i = 0; i < lines.length && found.length < 3; i++){
        if(lines[i].toLowerCase().indexOf(needle) > -1 && lines[i].trim().length > 3) found.push(lines[i].trim());
      }
      if(!found.length) return;
      hits++;
      var a = el("a","result");
      a.href = "#/doc/" + x.d.id;
      a.appendChild(el("div","r-t",(x.d.num ? x.d.num + ". " : "") + x.d.title));
      found.forEach(function(line){
        var snip = line.length > 220 ? line.slice(0, 220) + "..." : line;
        var s = el("div","r-s");
        s.innerHTML = esc(snip).replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")","ig"), "<mark>$1</mark>");
        a.appendChild(s);
      });
      host.appendChild(a);
    });
    if(!hits) host.appendChild(el("p","loading","Nothing found for that."));
  });
}

/* ============================ boot ============================ */
buildNav();
render();
initCaps();

window.addEventListener("hashchange", function(){
  var s = $("#search");
  if(s.value){ s.value = ""; }
  render();
});
$("#search").addEventListener("input", function(e){
  clearTimeout(searchTimer);
  var v = e.target.value.trim();
  searchTimer = setTimeout(function(){ runSearch(v); }, 260);
});
$("#menubtn").addEventListener("click", function(){
  var s = $("#side");
  s.classList.toggle("open");
  $("#scrim").hidden = !s.classList.contains("open");
});
$("#scrim").addEventListener("click", function(){
  $("#side").classList.remove("open");
  $("#scrim").hidden = true;
});
$("#themebtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  localSet("theme", next);
});
var savedTheme = localGet("theme");
if(savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
})();
</script>
