<g id="boxes-and-text">
<rect x="1160" y="396" width="166.56" height="21.5" rx="3" fill="rgb(255, 255, 255)" stroke="rgb(162, 169, 178)" stroke-width="1" stroke-dasharray="4.0 3.0"/>
<rect x="1160" y="516" width="166.56" height="21.5" rx="3" fill="rgb(255, 255, 255)" stroke="rgb(162, 169, 178)" stroke-width="1" stroke-dasharray="4.0 3.0"/>
<rect x="84" y="736" width="1432" height="76.5" rx="4" fill="rgb(244, 246, 249)" stroke="none"/>
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">HOW WORK IS ROUTED</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">Every piece of work takes one of three routes.</text>
<text x="84" y="184.77" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">You always know which one.</text>
<text x="84" y="238.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">At briefing we choose a route for each deliverable. The route decides how much of the production sequence our people run and how much the system runs. It never </text>
<text x="84" y="264.91" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">changes who approves the work.</text>
<text x="84" y="333.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">ROUTE</text>
<text x="462" y="338.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">our team</text>
<text x="582" y="338.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">the system</text>
<text x="1070.99" y="333.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" text-anchor="middle" xml:space="preserve">APPROVAL</text>
<text x="1070.99" y="723.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">the same gate,</text>
<text x="1071" y="740.08" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">every route</text>
<text x="1160" y="333.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">WHAT IT IS USED FOR</text>
<text x="84" y="404.08" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" xml:space="preserve">Assisted</text>
<text x="84" y="431.87" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">Our team leads the work. The system takes specific </text>
<text x="84" y="451.02" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">steps within it.</text>
<text x="440" y="451.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Most of the sequence is run by our people</text>
<text x="1170" y="409.98" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" xml:space="preserve">Examples to be completed</text>
<text x="84" y="524.08" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" xml:space="preserve">Augmented</text>
<text x="84" y="551.87" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">The system carries most of the sequence. Our team </text>
<text x="84" y="571.02" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">directs it and steps in where craft decides the outcome.</text>
<text x="440" y="571.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Shared, and the balance shifts by deliverable</text>
<text x="1170" y="529.98" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" xml:space="preserve">Examples to be completed</text>
<text x="84" y="644.08" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" xml:space="preserve">Automated</text>
<text x="84" y="671.87" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">The system runs the sequence end to end. Our team </text>
<text x="84" y="691.02" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">sets it up and checks what comes out.</text>
<text x="440" y="691.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Our people set the rules, then review the output</text>
<text x="1160" y="650.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Versioning and translation at volume</text>
<text x="108" y="768.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">One approval gate, whichever route the work takes.</text>
<text x="479.25" y="768.7" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">  Nothing is released without your named approver signing it off, including on the automated route. The balance shown above is indicative of the </text>
<text x="108" y="788.95" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">difference between the routes rather than a fixed split.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">03</text>
</g>
</svg>