  <line x1="1058" y1="342" x2="1076" y2="342" marker-end="url(#ahh)" fill="none" stroke="rgb(221, 225, 231)" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="1286" y1="342" x2="1304" y2="342" marker-end="url(#ahh)" fill="none" stroke="rgb(221, 225, 231)" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="404" y1="366" x2="1504" y2="318" stroke="rgb(162, 169, 178)" stroke-width="1.6" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="404" y1="318" x2="1504" y2="366" stroke="rgb(162, 169, 178)" stroke-width="1.6" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter"></line>

  <!-- the new way -->
  <rect x="84" y="470" width="330" height="190" fill="rgb(233, 241, 247)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="446" y="470" width="330" height="190" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="808" y="470" width="330" height="190" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="1170" y="470" width="346" height="190" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <line x1="418" y1="565" x2="442" y2="565" marker-end="url(#ah2)" fill="none" stroke="rgb(20, 23, 28)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="780" y1="565" x2="804" y2="565" marker-end="url(#ah2)" fill="none" stroke="rgb(20, 23, 28)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="1142" y1="565" x2="1166" y2="565" marker-end="url(#ah2)" fill="none" stroke="rgb(20, 23, 28)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></line>

  <!-- 1 search -->
  <circle cx="140" cy="556" r="17" fill="rgb(233, 241, 247)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></circle>
  <line x1="152" y1="568" x2="166" y2="582" stroke="rgb(29, 92, 140)" stroke-width="2.6" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <!-- 2 what already exists -->
  <rect x="478" y="546" width="22" height="22" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="506" y="546" width="22" height="22" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="534" y="546" width="22" height="22" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="562" y="546" width="22" height="22" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="590" y="546" width="22" height="22" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="618" y="546" width="22" height="22" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="478" y="574" width="22" height="22" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="506" y="574" width="22" height="22" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="534" y="574" width="22" height="22" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <!-- 3 the order form -->
  <rect x="834" y="544" width="278" height="26" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="834" y="576" width="278" height="26" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="834" y="608" width="278" height="26" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <!-- 4 delivered -->
  <circle cx="1224" cy="556" r="19" fill="rgb(233, 241, 247)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></circle>
  <use href="#personA" x="1224" y="562" fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"></use>
  <rect x="1274" y="536" width="42" height="42" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <line x1="1250" y1="556" x2="1268" y2="556" marker-end="url(#ah2)" fill="none" stroke="rgb(20, 23, 28)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></line>
</g>
<g id="boxes-and-text">
<rect x="84" y="700" width="1432" height="76.5" rx="4" fill="rgb(233, 241, 247)" stroke="none"/>
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">WHAT IT MEANS IN PRACTICE</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">Your second market orders what already exists.</text>
<text x="84" y="184.77" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">It does not brief again.</text>
<text x="84" y="238.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">Because every brief leaves its components and a record behind, the next market can search, find and order. Language, format and local claims become choices on a form </text>
<text x="84" y="264.91" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">rather than a new brief, a new schedule and a new cost.</text>
<text x="84" y="341.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">INSTEAD OF THIS</text>
<text x="497.99" y="346.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">New brief</text>
<text x="726" y="346.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Concept</text>
<text x="953.99" y="346.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Shoot and produce</text>
<text x="1182" y="346.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Review</text>
<text x="1409.99" y="346.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Deliver</text>
<text x="396" y="396.18" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">Close to full cost and full timeline, to produce something that is a near neighbour of an asset already sitting in your DAM.</text>
<text x="84" y="449.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">THIS HAPPENS INSTEAD</text>
<text x="104" y="499.64" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 1</text>
<text x="104" y="524.39" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" xml:space="preserve">Search your DAM</text>
<text x="104" y="611.98" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Your second market looks in the system they already </text>
<text x="104" y="628.08" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">use, for work that already exists.</text>
<text x="466" y="499.64" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 2</text>
<text x="466" y="524.39" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" xml:space="preserve">See what carries over</text>
<text x="466" y="619.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Six of the nine components from the first market carry </text>
<text x="466" y="636.08" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">straight across. Three are market-specific and get </text>
<text x="466" y="652.17" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">replaced.</text>
<text x="828" y="499.64" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 3</text>
<text x="828" y="524.39" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" xml:space="preserve">Place an order</text>
<text x="844" y="562.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Language   </text>
<text x="904.77" y="562.98" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">local</text>
<text x="844" y="594.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Formats   </text>
<text x="895.77" y="594.98" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">9:16, banner</text>
<text x="844" y="626.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Local claims   </text>
<text x="916.86" y="626.98" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">applied</text>
<text x="828" y="653.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">A form, not a brief.</text>
<text x="1190" y="499.64" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 4</text>
<text x="1190" y="524.39" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" xml:space="preserve">Approved and delivered</text>
<text x="1190" y="611.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Same approval gate as any other route, then delivered and </text>
<text x="1190" y="628.08" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">registered back, so the third market starts from a larger set </text>
<text x="1190" y="644.17" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">again.</text>
<text x="108" y="732.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Nobody writes a creative brief. Nobody schedules a shoot.</text>
<text x="529.23" y="732.7" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">  And nobody in the second market needs to know the first market’s production history to place the order. What can be ordered is exactly what </text>
<text x="108" y="752.95" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">the record says already exists.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">08</text>
</g>
</svg>