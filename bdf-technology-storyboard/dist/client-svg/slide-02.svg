<g id="boxes-and-text">
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">HOW THE EFFICIENCY WORKS</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">We make the parts once, then assemble them into everything.</text>
<text x="84" y="190.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">Traditional production builds each asset from scratch. Modular production builds the components once, then recombines them into every format, channel and market that </text>
<text x="84" y="216.91" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">needs them. The saving compounds every time something new is asked for.</text>
<text x="84" y="305.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">ONE BRIEF</text>
<text x="360" y="305.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">COMPONENTS, MADE ONCE</text>
<text x="940" y="305.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">FINISHED OUTPUTS, ASSEMBLED FROM THEM</text>
<text x="104" y="441.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.61" xml:space="preserve">EXAMPLE</text>
<text x="104" y="469.48" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" xml:space="preserve">Seasonal launch film</text>
<text x="104" y="495.02" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">One shoot. One edit. One approval </text>
<text x="104" y="511.11" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">round.</text>
<text x="400" y="388.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Hero film master</text>
<text x="400" y="427.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Product macro</text>
<text x="400" y="466.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Voice over</text>
<text x="400" y="505.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Music bed</text>
<text x="400" y="544.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Subtitle track</text>
<text x="400" y="583.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Copy block</text>
<text x="400" y="622.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Logo lockup</text>
<text x="400" y="661.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Legal and claims line</text>
<text x="400" y="700.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Price and promotion layer</text>
<text x="1012" y="388.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Social cut-down </text>
<text x="1131.19" y="388.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">9:16</text>
<text x="1012" y="447.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Hero film </text>
<text x="1081.19" y="447.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">16:9</text>
<text x="1012" y="506.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Six-second bumper </text>
<text x="1155.38" y="506.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">16:9</text>
<text x="1012" y="565.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Retail display banner</text>
<text x="1012" y="624.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">CRM header </text>
<text x="1103.69" y="624.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">4:5</text>
<text x="1012" y="683.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">E-commerce product still </text>
<text x="1196.22" y="683.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">1:1</text>
<text x="1500" y="387.98" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" xml:space="preserve">uses the hero master</text>
<text x="1500" y="446.98" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" xml:space="preserve">uses the hero master</text>
<text x="1500" y="505.98" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" xml:space="preserve">uses the hero master</text>
<text x="105" y="572.04" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" xml:space="preserve">Nine components.</text>
<text x="105" y="593.64" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" xml:space="preserve">Six finished outputs.</text>
<text x="105" y="619.37" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">Add a seventh output, a new market </text>
<text x="105" y="639.62" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">or a new format and it draws mostly </text>
<text x="105" y="659.87" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">on components that already exist.</text>
<text x="84" y="713.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">One component’s route is drawn in full so the </text>
<text x="84" y="730.08" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">diagram stays readable. Every component works </text>
<text x="84" y="746.17" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">the same way.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">02</text>
</g>
