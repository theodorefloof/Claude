<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<g id="geometry"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#14171C"></path></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#14171C"></path></marker>
<marker id="aha" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1D5C8C"></path></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#A2A9B2"></path></marker>
<marker id="ahh" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#DDE1E7"></path></marker>
<g id="person"><circle cx="0" cy="-4.8" r="3.6" fill="none" stroke="#14171C" stroke-width="1.7"></circle><path d="M-6.6,6.2 a6.6,6.8 0 0 1 13.2,0" fill="none" stroke="#14171C" stroke-width="1.7"></path></g>
<g id="personA"><circle cx="0" cy="-4.8" r="3.6" fill="none" stroke="#1D5C8C" stroke-width="1.7"></circle><path d="M-6.6,6.2 a6.6,6.8 0 0 1 13.2,0" fill="none" stroke="#1D5C8C" stroke-width="1.7"></path></g>
<g id="tick"><path d="M-5,0 l3.6,4 l7,-9" fill="none" stroke="#1D5C8C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></g>
<pattern id="hg" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#F4F6F9"></rect><line x1="0" y1="0" x2="0" y2="7" stroke="#DDE1E7" stroke-width="2.4"></line></pattern>
</defs>

  <!-- your library, as one bar -->
  <rect x="84" y="330" width="1076" height="86" fill="url(&quot;#hg&quot;)" stroke="rgb(162, 169, 178)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="1160" y="330" width="356" height="86" fill="rgb(29, 92, 140)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>

  <!-- ghosted components on the left, complete ones on the right -->
  <g fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
    <rect x="112" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect><rect x="144" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect>
    <rect x="176" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect><rect x="208" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(221, 225, 231)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  </g>
  <line x1="256" y1="364" x2="420" y2="364" fill="none" stroke="rgb(162, 169, 178)" stroke-width="1.4" stroke-dasharray="6, 5" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="256" y1="382" x2="360" y2="382" fill="none" stroke="rgb(162, 169, 178)" stroke-width="1.4" stroke-dasharray="6, 5" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <g fill="rgb(255, 255, 255)" stroke="rgb(255, 255, 255)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter">
    <rect x="1184" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(255, 255, 255)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></rect><rect x="1216" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(255, 255, 255)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></rect>
    <rect x="1248" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(255, 255, 255)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></rect><rect x="1280" y="360" width="24" height="24" fill="rgb(255, 255, 255)" stroke="rgb(255, 255, 255)" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  </g>

  <!-- the boundary moves as material gets reused -->
  <line x1="1160" y1="310" x2="1160" y2="452" fill="none" stroke="rgb(29, 92, 140)" stroke-width="1.9" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="1150" y1="452" x2="1000" y2="452" marker-end="url(#aha)" fill="none" stroke="rgb(29, 92, 140)" stroke-width="1.9" stroke-linecap="butt" stroke-linejoin="miter"></line>

  <!-- three points -->
  <line x1="84" y1="540" x2="140" y2="540" stroke="rgb(29, 92, 140)" stroke-width="3" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="588" y1="540" x2="644" y2="540" stroke="rgb(29, 92, 140)" stroke-width="3" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter"></line>
  <line x1="1092" y1="540" x2="1148" y2="540" stroke="rgb(29, 92, 140)" stroke-width="3" fill="rgb(0, 0, 0)" stroke-linecap="butt" stroke-linejoin="miter"></line>
</g>
<g id="boxes-and-text">
<rect x="84" y="724" width="1432" height="52.25" rx="4" fill="rgb(244, 246, 249)" stroke="none"/>
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">YOUR EXISTING LIBRARY</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">Getting started does not depend on tidying your archive first.</text>
<text x="84" y="190.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">Everything produced from day one is fully described and ready to reorder immediately. For material already in your DAM, we describe it at the point it is first reused, so there is </text>
<text x="84" y="216.91" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">no cataloguing project to finish before the benefit starts.</text>
<text x="84" y="309.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">EVERYTHING IN YOUR DAM</text>
<text x="440" y="366.18" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" xml:space="preserve">Already there, described inconsistently</text>
<text x="440" y="387.14" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">usable, but not yet orderable as components</text>
<text x="1496" y="360.18" fill="rgb(255, 255, 255)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="end" xml:space="preserve">Produced from day one</text>
<text x="1496" y="381.14" fill="rgb(207, 224, 236)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" xml:space="preserve">complete record,</text>
<text x="1496" y="397.23" fill="rgb(207, 224, 236)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" xml:space="preserve">orderable immediately</text>
<text x="980" y="455.98" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="end" xml:space="preserve">this boundary moves every time something is reused</text>
<text x="84" y="581.04" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" xml:space="preserve">Nothing to do before we start</text>
<text x="84" y="607.97" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">Your first briefs run from day one. They do not wait on the state of the </text>
<text x="84" y="628.22" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">archive, and they do not depend on it.</text>
<text x="588" y="581.04" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" xml:space="preserve">Described when it is used</text>
<text x="588" y="607.97" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">The first time a piece of existing material is reused, we describe it </text>
<text x="588" y="628.22" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">properly, once. From that point it behaves like anything else in the </text>
<text x="588" y="648.47" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">system.</text>
<text x="1092" y="581.04" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" xml:space="preserve">Prioritised only where it pays</text>
<text x="1092" y="607.97" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">If part of your library has obvious demand, we can prepare it ahead of </text>
<text x="1092" y="628.22" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">time. We will agree that with you in discovery rather than assume it.</text>
<text x="106" y="754.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">You raised this in the last round, and it is a fair challenge.</text>
<text x="520.27" y="754.7" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">  The answer is that the value does not sit behind a back-catalogue project. It starts with your first brief and the archive catches up behind it.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">10</text>
</g>
</svg>