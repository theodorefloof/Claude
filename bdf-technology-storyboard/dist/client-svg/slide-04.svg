<g id="boxes-and-text">
<rect x="84" y="744" width="1432" height="56.25" rx="4" fill="rgb(233, 241, 247)" stroke="none"/>
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">THE PLATFORM</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">One layer connects your systems to our production tools.</text>
<text x="84" y="190.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">MAKE sits between the two. Your DAM, your approvals and your channels connect on one side. The tools our teams produce with connect on the other. Tools can be added </text>
<text x="84" y="216.91" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">or swapped without anything else changing, and nothing you already run is replaced.</text>
<text x="84" y="311.81" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">YOUR SYSTEMS</text>
<text x="104" y="366.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your DAM</text>
<text x="104" y="388.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">where your assets live, before and after</text>
<text x="104" y="456.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your brand, claims and legal rules</text>
<text x="104" y="478.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">what any output is allowed to say</text>
<text x="104" y="546.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your review and approval</text>
<text x="104" y="568.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">your approvers, in your process</text>
<text x="104" y="636.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your channels and e-commerce</text>
<text x="104" y="658.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">where finished work has to land</text>
<text x="800" y="376.75" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.88" text-anchor="middle" xml:space="preserve">MAKE</text>
<text x="799.99" y="405.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" text-anchor="middle" xml:space="preserve">THE LAYER IN THE MIDDLE</text>
<text x="606" y="480.18" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" xml:space="preserve">It routes a brief through production</text>
<text x="606" y="511.33" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" xml:space="preserve">It holds every version, review and approval in one place</text>
<text x="606" y="542.49" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" xml:space="preserve">It runs the tasks that do the work</text>
<text x="800" y="643.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" text-anchor="middle" xml:space="preserve">OPEN CONNECTIONS</text>
<text x="799.99" y="667.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Any tool can plug in here. Tools change without the layer changing.</text>
<text x="1130" y="311.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">OUR PRODUCTION TOOLS</text>
<text x="1150" y="366.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Generation</text>
<text x="1150" y="388.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">in use on our work today</text>
<text x="1150" y="456.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Editing and compositing</text>
<text x="1150" y="478.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">in use on our work today</text>
<text x="1150" y="546.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Translation and localisation</text>
<text x="1150" y="568.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">in use on our work today</text>
<text x="1150" y="636.7" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Whatever comes next</text>
<text x="1150" y="658.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">added as a connection, not a rebuild</text>
<text x="108" y="776.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">The connections on the left are the work we do together at the start.</text>
<text x="595.86" y="776.7" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">  The ones on the right are already in place. That is the whole of the difference between what exists and what we build.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">04</text>
</g>
</svg>