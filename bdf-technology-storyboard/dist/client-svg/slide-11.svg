<g id="boxes-and-text">
<rect x="1112" y="558.25" width="390" height="27.5" rx="3" fill="rgb(255, 255, 255)" stroke="rgb(162, 169, 178)" stroke-width="1" stroke-dasharray="4.0 3.0"/>
<rect x="84" y="766" width="1432" height="52.25" rx="4" fill="rgb(244, 246, 249)" stroke="none"/>
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">TODAY AND NEXT</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">What runs from day one, what we connect, and where it goes next.</text>
<text x="84" y="190.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">Three states, and nothing listed that does not exist. There are no dates on this page: timings belong in the plan rather than in a technology section.</text>
<text x="116" y="357.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">RUNNING TODAY</text>
<text x="116" y="381.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">In daily use on our work, before this engagement</text>
<text x="148" y="417.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">MAKE, the layer in the middle</text>
<text x="148" y="465.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Versions, review and approval in one place</text>
<text x="148" y="513.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">The tasks that do the work</text>
<text x="148" y="561.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Open connections to production tools</text>
<text x="148" y="609.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Modular component production</text>
<text x="148" y="657.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Assisted, augmented and automated routes</text>
<text x="116" y="697.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Every item here is on an earlier page in this section.</text>
<text x="614" y="357.81" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">WHAT WE CONNECT WITH YOU</text>
<text x="614" y="381.98" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Scoped together at the start. This is the whole of the new work.</text>
<text x="646" y="417.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your DAM, in and out</text>
<text x="646" y="436.98" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">see page 07</text>
<text x="646" y="465.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your metadata, mapped to components</text>
<text x="646" y="513.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your review and approval process</text>
<text x="646" y="561.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your channels and e-commerce feeds</text>
<text x="646" y="609.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Your approach to the existing library</text>
<text x="646" y="628.98" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">see page 10</text>
<text x="614" y="697.98" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Connection work, not construction work.</text>
<text x="1112" y="357.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">WHERE IT GOES NEXT</text>
<text x="1112" y="381.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Direction of travel, at theme level</text>
<text x="1112" y="418.18" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">The platform keeps developing, and you get the benefit of that </text>
<text x="1112" y="437.33" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">without a migration or a new agreement. We share the roadmap </text>
<text x="1112" y="456.49" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">at theme level rather than committing to features in a pitch.</text>
<text x="1112" y="513.64" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">THEMES IN VIEW</text>
<text x="1112" y="540.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Post-production compositing</text>
<text x="1307" y="575.23" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" text-anchor="middle" xml:space="preserve">Further themes to be completed</text>
<text x="1112" y="697.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">No dates and no feature commitments on this page.</text>
<text x="106" y="796.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">The middle column is the only new work in this proposal.</text>
<text x="518.02" y="796.7" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">  The left column exists already. The right column is direction, not a promise.</text>
<text x="1500.84" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">11</text>
</g>
</svg>