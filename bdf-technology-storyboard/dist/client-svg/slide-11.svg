  <rect x="84" y="316" width="466" height="418" stroke-width="1.7" fill="rgb(255, 255, 255)" stroke="rgb(20, 23, 28)" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="582" y="316" width="466" height="418" fill="rgb(233, 241, 247)" stroke="rgb(29, 92, 140)" stroke-width="1.7" stroke-linecap="butt" stroke-linejoin="miter"></rect>
  <rect x="1080" y="316" width="436" height="418" fill="rgb(255, 255, 255)" stroke="rgb(162, 169, 178)" stroke-width="1.4" stroke-dasharray="6, 5" stroke-linecap="butt" stroke-linejoin="miter"></rect>

