<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">MODULARITY</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">A brief only uses the parts of the system it needs.</text>
<text x="84" y="190.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">MAKE is a set of modules, not one product you switch on whole. A single social cut-down touches two of them. A nine-market campaign touches all of them. There is nothing </text>
<text x="84" y="216.91" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">to implement twice, and nothing for your team to learn about the parts a brief never uses.</text>
<text x="458" y="301.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">THE MODULE SET</text>
<text x="529" y="366.18" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">One connected </text>
<text x="529" y="385.33" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">space</text>
<text x="659" y="366.18" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">AI tasks</text>
<text x="788.99" y="366.18" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">Open </text>
<text x="788.99" y="385.33" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">integrations</text>
<text x="918.99" y="366.18" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">Global </text>
<text x="918.99" y="385.33" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" xml:space="preserve">e‑commerce</text>
<text x="1048.99" y="384.98" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" text-anchor="middle" xml:space="preserve">Module</text>
<text x="1178.99" y="384.98" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" text-anchor="middle" xml:space="preserve">Module</text>
<text x="1308.99" y="384.98" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" text-anchor="middle" xml:space="preserve">Module</text>
<text x="1438.99" y="384.98" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="0.46" text-anchor="middle" xml:space="preserve">Module</text>
<text x="84" y="330.18" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">Each module handles a different part of production. A </text>
<text x="84" y="349.33" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">module is switched on for a brief or it is not. There is </text>
<text x="84" y="368.49" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">no partial state and no second implementation </text>
<text x="84" y="387.65" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="13.5" xml:space="preserve">underneath.</text>
<text x="84" y="471.81" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.87" xml:space="preserve">THREE BRIEFS, THREE DIFFERENT SETS</text>
<text x="84" y="526.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">One social cut-down</text>
<text x="84" y="547.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">single market</text>
<text x="84" y="596.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Full campaign</text>
<text x="84" y="617.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">nine markets, every format</text>
<text x="84" y="666.7" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">E-commerce refresh</text>
<text x="84" y="687.23" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">across a product range</text>
<text x="108" y="738.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">switched on</text>
<text x="244" y="738.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">not used for this brief</text>
<text x="480" y="742.7" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" xml:space="preserve">Complexity is only a problem if you have to absorb all of it.</text>
<text x="904.53" y="742.7" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">  Nobody on your side configures, licenses or learns the modules a brief does not touch.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">05</text>
</g>
</svg>