<g id="boxes-and-text">
<rect x="84" y="646" width="1432" height="128.14" rx="4" fill="rgb(233, 241, 247)" stroke="none"/>
<text x="84" y="79.81" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" xml:space="preserve">IN THE SESSION</text>
<text x="84" y="136.05" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8" xml:space="preserve">You choose two scenarios, and we run them live.</text>
<text x="84" y="190.39" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="17" xml:space="preserve">Not a recording and not a mock-up. On the day you pick two from the scenarios we bring, and we run them in the actual system, from brief through to finished output.</text>
<text x="116" y="311.64" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 1</text>
<text x="116" y="338.24" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" xml:space="preserve">We bring the scenarios</text>
<text x="248.99" y="543.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Real production situations, chosen because they </text>
<text x="249" y="560.08" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">look like your work</text>
<text x="484" y="311.64" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 2</text>
<text x="484" y="338.24" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" xml:space="preserve">You choose two</text>
<text x="617" y="543.98" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">Your choice, in the room, on the day. We do not pick </text>
<text x="616.99" y="560.08" fill="rgb(58, 107, 147)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">for you.</text>
<text x="852" y="311.64" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 3</text>
<text x="852" y="338.24" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" xml:space="preserve">We run them live</text>
<text x="984.99" y="577.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">In the working system, not a slide of it</text>
<text x="1220" y="311.64" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.79" xml:space="preserve">STEP 4</text>
<text x="1220" y="338.24" fill="rgb(20, 23, 28)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" xml:space="preserve">You see what comes out</text>
<text x="1351.99" y="563.98" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">The outputs, and the route and components behind </text>
<text x="1351.99" y="580.08" fill="rgb(120, 128, 139)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">each one</text>
<text x="114" y="691.08" fill="rgb(29, 92, 140)" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" xml:space="preserve">The point of the live session is that nothing on the previous eleven pages needs taking on trust.</text>
<text x="114" y="722.34" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">What we show you on the day is the platform running now, not a build of it. The one thing this section describes as new work is the connection to your systems, and that is scoped on page 11. If there is a </text>
<text x="114" y="742.59" fill="rgb(62, 69, 79)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">scenario you would rather see than the ones we bring, tell us beforehand and we will prepare it.</text>
<text x="1500.23" y="845.81" fill="rgb(162, 169, 178)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.76" xml:space="preserve">12</text>
</g>
</svg>