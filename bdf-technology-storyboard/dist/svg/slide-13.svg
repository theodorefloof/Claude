<g id="boxes-and-text">
<rect x="1282.88" y="239" width="261.13" height="19" rx="2" fill="none" stroke="rgb(154, 154, 154)" stroke-width="1"/>
<rect x="56" y="696" width="730" height="79.64" rx="2" fill="rgb(255, 255, 255)" stroke="rgb(212, 212, 212)" stroke-width="1"/>
