<text x="56" y="55.16" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.92" xml:space="preserve">07</text>
<text x="73.2" y="55.16" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.92" xml:space="preserve">  ·  TODAY AND NEXT</text>
<text x="56" y="100.24" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.37" xml:space="preserve">Your effort is front-loaded and then falls away.</text>
<text x="56" y="137.12" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.37" xml:space="preserve">Ours rises as more AI tasks come online.</text>
<text x="56" y="177.7" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Directional only. Both axes are deliberately unnumbered. Nothing on this slide is quantified, and nothing will be until the efficiency target is defined.</text>
<text x="1536" y="251.79" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.14" text-anchor="end" xml:space="preserve">SHAPE OF THE RELATIONSHIP  ·  NO UNITS</text>
<text x="56" y="277.64" fill="rgb(36, 95, 166)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">WHAT WE NEED FROM YOU</text>
<text x="74" y="316.98" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">All of it, in one list</text>
<text x="74" y="343.04" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">DAM access and your metadata schema</text>
<text x="74" y="362.47" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">Named approvers and approval rules</text>
<text x="74" y="381.89" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">Brand, claims and legal rules</text>
<text x="74" y="401.31" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">A decision on historic assets (slide 11)
  </text>
<text x="56" y="471.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" xml:space="preserve">This is the effort you were worried about.</text>
<text x="261.38" y="471.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve"> It is </text>
<text x="56" y="485.5" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">named, it is bounded, and it happens once.</text>
<text x="1330" y="332.98" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">Share of the sequence carried by AI </text>
<text x="1330" y="348.39" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">tasks</text>
<text x="1330" y="371.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">rises as the task library fills and roadmap </text>
<text x="1330" y="385.5" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">themes land. Slide 12 lists them.</text>
<text x="1330" y="570.98" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">Your effort</text>
<text x="1330" y="591.64" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">settles below where it sits today, because </text>
<text x="1330" y="605.5" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">second markets order rather than re-brief.</text>
<text x="443.99" y="635.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" text-anchor="middle" xml:space="preserve">INTEGRATE</text>
<text x="692" y="635.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" text-anchor="middle" xml:space="preserve">FIRST BRIEFS</text>
<text x="939.99" y="635.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" text-anchor="middle" xml:space="preserve">STEADY STATE</text>
<text x="1190" y="635.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" text-anchor="middle" xml:space="preserve">SCALE</text>
<text x="444" y="655.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" xml:space="preserve">the one-off ask, above</text>
<text x="691.99" y="655.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" xml:space="preserve">first deliverables through MAKE</text>
<text x="940" y="655.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" xml:space="preserve">second markets start ordering</text>
<text x="1189.99" y="655.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" xml:space="preserve">more formats, more markets, same team</text>
<text x="74" y="717.79" fill="rgb(255, 255, 255)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.24" xml:space="preserve">WHY THIS SLIDE IS UNNUMBERED</text>
<text x="68" y="743.97" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">A number on either axis would be the most quotable thing in the whole section, and the most damaging one if we cannot stand behind it. </text>
<text x="68" y="760.3" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">The shape is defensible today. The numbers are not.</text>
<text x="832" y="717.79" fill="rgb(255, 255, 255)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.24" xml:space="preserve">OPEN</text>
<text x="876.88" y="718.98" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">The 80% target belongs on this chart,</text>
<text x="1081.36" y="718.98" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve"> and it is the thing that would turn a shape into a commitment. It cannot go on until it is </text>
<text x="826" y="735.97" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">defined: 80% of what, by when, measured how, against which baseline.
  </text>
<text x="826" y="757.3" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Same open item as slide 02. </text>
<text x="974.31" y="757.3" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">One answer unlocks both slides.</text>
<text x="56" y="863.64" fill="rgb(154, 154, 154)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.16" xml:space="preserve">TECHNOLOGY SECTION  ·  STORYBOARD FOR NARRATIVE AGREEMENT</text>
<text x="1503.8" y="863.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.16" xml:space="preserve">13 / 15</text>
</g>
</svg>