<text x="56" y="55.16" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.92" xml:space="preserve">03</text>
<text x="73.2" y="55.16" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.92" xml:space="preserve">  ·  THE TECHNOLOGY</text>
<text x="56" y="100.24" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.37" xml:space="preserve">MAKE is the orchestration layer our teams already use.</text>
<text x="56" y="137.12" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.37" xml:space="preserve">Proprietary core, open edges.</text>
<text x="56" y="177.7" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Read the outlines. Solid means built and running on our work today. Dashed means integration. Everything new in this proposal is on the left of this diagram, and it is </text>
<text x="56" y="199.45" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">connection work, not platform work.</text>
<text x="1285.48" y="247.97" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0.9" xml:space="preserve">TODAY</text>
<text x="1374.89" y="247.97" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0.9" xml:space="preserve">INTEGRATION</text>
<text x="1503.94" y="247.97" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0.9" xml:space="preserve">YOURS</text>
<text x="56" y="271.64" fill="rgb(36, 95, 166)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">YOURS  ·  CONNECTED DURING INTEGRATION</text>
<text x="72" y="321" fill="rgb(36, 95, 166)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Your DAM</text>
<text x="72" y="337.26" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">source of truth for assets and metadata</text>
<text x="72" y="409" fill="rgb(36, 95, 166)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Your brand, claims and legal rules</text>
<text x="72" y="425.26" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">what any output is allowed to say</text>
<text x="72" y="497" fill="rgb(36, 95, 166)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Your review and approval</text>
<text x="72" y="513.26" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">your approvers, in your process</text>
<text x="72" y="585" fill="rgb(36, 95, 166)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Your channels and e-commerce feeds</text>
<text x="72" y="601.26" fill="rgb(74, 109, 153)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">where finished outputs have to land</text>
<text x="799.99" y="321.86" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8" text-anchor="middle" xml:space="preserve">MAKE</text>
<text x="799.99" y="346.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.26" text-anchor="middle" xml:space="preserve">ORCHESTRATION LAYER  ·  EXISTS TODAY</text>
<text x="532" y="409.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">PROPRIETARY CORE</text>
<text x="547" y="436.98" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Routes a brief through the production sequence</text>
<text x="547" y="457.39" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Holds versions, review and approval in one connected space</text>
<text x="547" y="477.8" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Runs AI tasks against briefs, assets and outputs</text>
<text x="799.99" y="579.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" text-anchor="middle" xml:space="preserve">OPEN MIDDLEWARE</text>
<text x="799.99" y="599.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" xml:space="preserve">Any third-party tool plugs in here. Tools change without the layer changing.</text>
<text x="1188" y="271.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">TOOLS WE ORCHESTRATE  ·  ALREADY CONNECTED</text>
<text x="1204" y="321" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Generation tools</text>
<text x="1204" y="337.26" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">named tools confirmed separately, see flag below</text>
<text x="1204" y="409" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Editing and compositing tools</text>
<text x="1204" y="425.26" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">in use on our work today</text>
<text x="1204" y="497" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Translation and localisation tools</text>
<text x="1204" y="513.26" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">in use on our work today</text>
<text x="1204" y="585" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">Anything you already use</text>
<text x="1204" y="601.26" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">connected as a plug-in, not replaced</text>
<text x="74" y="715.79" fill="rgb(255, 255, 255)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.24" xml:space="preserve">THE POINT OF THIS SLIDE</text>
<text x="68" y="741.97" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">The middleware is the answer to “it needs building”.</text>
<text x="354.28" y="741.97" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve"> The orchestration layer is built. Tools plug into it and can be swapped without </text>
<text x="68" y="758.3" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">rebuilding anything. Nothing in this proposal asks you to replace a tool you already run, and nothing waits on a platform being finished.</text>
<text x="832" y="715.79" fill="rgb(255, 255, 255)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.24" xml:space="preserve">OPEN</text>
<text x="876.88" y="716.98" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">Tool names are deliberately absent.</text>
<text x="1070.97" y="716.98" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve"> The split between the creation tool and the aggregating tool for the live demonstration has </text>
<text x="826" y="733.97" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">not been confirmed, and what was shown in preparation was not the tool intended for the pitch.
  </text>
<text x="826" y="755.3" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Until the demo lead confirms, naming tools here risks contradicting the live session. </text>
<text x="1252.98" y="755.3" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">Needed before: the live rehearsal.</text>
<text x="56" y="863.64" fill="rgb(154, 154, 154)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.16" xml:space="preserve">TECHNOLOGY SECTION  ·  STORYBOARD FOR NARRATIVE AGREEMENT</text>
<text x="1503.8" y="863.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.16" xml:space="preserve">04 / 15</text>
</g>
</svg>