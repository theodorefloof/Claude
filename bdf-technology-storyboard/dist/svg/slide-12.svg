<text x="56" y="55.16" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.92" xml:space="preserve">07</text>
<text x="73.2" y="55.16" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.92" xml:space="preserve">  ·  TODAY AND NEXT</text>
<text x="56" y="100.24" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.37" xml:space="preserve">What is running, what we connect, and where it is heading.</text>
<text x="56" y="145.7" fill="rgb(61, 61, 61)" font-family="Arial, Helvetica, sans-serif" font-size="15" xml:space="preserve">Same legend as every other slide in this section. The roadmap is at theme level, not feature level: no dates, no percentages, and no list of things that do not exist yet.</text>
<text x="1536" y="199.79" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.14" text-anchor="end" xml:space="preserve">THEMES, NOT FEATURES  ·  NO DATES ON THIS SLIDE</text>
<text x="56" y="271.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">LIVE TODAY  ·  RUNNING ON OUR WORK NOW</text>
<text x="564" y="271.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">INTEGRATION  ·  THE NEW WORK IN THIS PROPOSAL</text>
<text x="1072" y="271.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">ROADMAP THEMES  ·  DIRECTION ONLY</text>
<text x="84" y="325.79" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.14" xml:space="preserve">NOTHING HERE IS A BUILD</text>
<text x="592" y="325.79" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.14" xml:space="preserve">SCOPED IN DISCOVERY</text>
<text x="1100" y="325.79" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.14" xml:space="preserve">NO COMMITMENT IMPLIED</text>
<text x="104" y="359" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">MAKE, the orchestration layer</text>
<text x="104" y="399" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">One connected space, with versioning and approval</text>
<text x="104" y="439" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">AI tasks, in use on our work</text>
<text x="104" y="479" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Open middleware and third-party connectors</text>
<text x="104" y="519" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Modular component production</text>
<text x="104" y="559" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Assisted, augmented and automated as routes</text>
<text x="76" y="595.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">Every item here is on a slide earlier in this section, drawn solid.</text>
<text x="612" y="359" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Connect your DAM, in and out</text>
<text x="612" y="407" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Map your metadata to the component registry</text>
<text x="612" y="455" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Connect your review and approval process</text>
<text x="612" y="503" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Connect your channel and e-commerce feeds</text>
<text x="612" y="559" fill="rgb(184, 105, 15)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" xml:space="preserve">An answer on historic assets  </text>
<text x="799.13" y="558.64" fill="rgb(184, 105, 15)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" xml:space="preserve">(slide 11)</text>
<text x="584" y="595.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">This column is the whole of the new work. It is connection, not construction.</text>
<text x="1120" y="355" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Post-production compositing</text>
<text x="1120" y="371.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">the one theme named in the discussion</text>
<text x="1120" y="407" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Theme 2</text>
<text x="1127" y="427.79" fill="rgb(184, 105, 15)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.95" xml:space="preserve">TBC</text>
<text x="1120" y="459" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Theme 3</text>
<text x="1127" y="479.79" fill="rgb(184, 105, 15)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.95" xml:space="preserve">TBC</text>
<text x="1120" y="511" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="13" xml:space="preserve">Theme 4</text>
<text x="1127" y="531.79" fill="rgb(184, 105, 15)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.95" xml:space="preserve">TBC</text>
<text x="1108" y="559.79" fill="rgb(255, 255, 255)" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.24" xml:space="preserve">OPEN</text>
<text x="1152.88" y="560.98" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" xml:space="preserve">Only one theme came out of the discussion. </text>
<text x="1379.81" y="560.98" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">Needed from: the </text>
<text x="1102" y="577.97" fill="rgb(90, 52, 6)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">product roadmap owner.</text>
<text x="56" y="651.64" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.58" xml:space="preserve">AND THE DIRECTION THE WHOLE THING MOVES IN</text>
<text x="76" y="694.98" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" xml:space="preserve">More AI tasks in use</text>
<text x="76" y="713.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" xml:space="preserve">as the library fills and the roadmap lands</text>
<text x="1528" y="694.98" fill="rgb(17, 17, 17)" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" text-anchor="end" xml:space="preserve">Efficiency curve rises</text>
<text x="1528" y="713.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" xml:space="preserve">directional only, and deliberately unnumbered. Slide 13 shows the </text>
<text x="1528" y="727.5" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" xml:space="preserve">shape.</text>
<text x="56" y="863.64" fill="rgb(154, 154, 154)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.16" xml:space="preserve">TECHNOLOGY SECTION  ·  STORYBOARD FOR NARRATIVE AGREEMENT</text>
<text x="1503.8" y="863.64" fill="rgb(111, 111, 111)" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.16" xml:space="preserve">12 / 15</text>
